<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vic-sound Creator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110d;
      color: white;
      padding: 20px;
    }

    .creator {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 25px;
    }

    .card {
      background: #102019;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #294238;
      border-radius: 10px;
      background: #08130f;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #27d17f;
      color: #06110b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #091711;
      display: none;
    }

    .song {
      padding: 15px 0;
      border-bottom: 1px solid #294238;
    }

    .song:last-child {
      border-bottom: none;
    }

    .song-title {
      font-weight: bold;
      font-size: 17px;
    }

    .song-info {
      margin-top: 5px;
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="creator">

    <h1>Vic-sound Creator</h1>
    <p class="subtitle">
      Creator Catalog
    </p>

    <section class="card">

      <h2>Add Music</h2>

      <label for="title">Song title</label>
      <input
        type="text"
        id="title"
        placeholder="Enter song title"
      >

      <label for="artist">Artist</label>
      <input
        type="text"
        id="artist"
        placeholder="Enter artist name"
      >

      <label for="genre">Genre</label>
      <input
        type="text"
        id="genre"
        placeholder="Example: Rap, Afrobeats, R&B"
      >

      <label for="mood">Mood</label>
      <input
        type="text"
        id="mood"
        placeholder="Example: Sad, Calm, Party"
      >

      <label for="releaseDate">Release date</label>
      <input
        type="date"
        id="releaseDate"
      >

      <label for="premium">Music type</label>
      <select id="premium">
        <option value="false">Free</option>
        <option value="true">Premium</option>
      </select>

      <label for="cover">Cover image</label>
      <input
        type="file"
        id="cover"
        accept="image/*"
      >

      <label for="audio">Music file</label>
      <input
        type="file"
        id="audio"
        accept="audio/*"
      >

      <label for="lyrics">Lyrics</label>
      <textarea
        id="lyrics"
        placeholder="Lyrics will eventually be generated automatically from the music."
      ></textarea>

      <button id="publishButton">
        Publish Music
      </button>

      <div id="status" class="status"></div>

    </section>

    <section class="card">

      <h2>Your Catalog</h2>

      <div id="songList">
        Loading catalog...
      </div>

    </section>

  </main>

  <script src="creator.js"></script>

</body>
  </html>
