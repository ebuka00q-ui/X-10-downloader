<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>X10 Downloader</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0a0a0f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0f;color:#fff;height:100vh;overflow:hidden;user-select:none}
#app{height:100vh;display:flex;flex-direction:column;background:#0a0a0f}

.header{padding:8px 14px 6px 14px;background:#0a0a0f;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,0,200,0.2);flex-shrink:0;z-index:10}
.header-title{font-size:17px;font-weight:900;background:linear-gradient(135deg,#ff66dd,#cc00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:12px}
.header-search{font-size:20px;color:#ff44cc;cursor:pointer;background:0;border:0;padding:4px}
.header-account{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff44cc,#aa00cc);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;cursor:pointer;border:2px solid rgba(255,0,200,0.4);box-shadow:0 0 25px rgba(255,0,200,0.3)}

.sub-tabs{display:flex;padding:6px 14px 0 14px;gap:16px;background:#0a0a0f;border-bottom:1px solid rgba(255,0,200,0.1);flex-shrink:0;z-index:10}
.sub-tab{padding:6px 2px 10px 2px;font-size:12px;font-weight:600;color:#555;cursor:pointer;border-bottom:3px solid transparent;transition:all .3s;text-transform:uppercase;letter-spacing:.5px}
.sub-tab.active{color:#ff44cc;border-bottom-color:#ff44cc;text-shadow:0 0 20px rgba(255,0,200,0.3)}

.content{flex:1;overflow:hidden;position:relative}
.page{display:none;height:100%;overflow-y:auto;padding:10px;scroll-behavior:smooth}
.page.active{display:block}

.video-feed{display:flex;flex-direction:column;gap:12px;padding-bottom:70px}
.video-card{background:linear-gradient(145deg,#12121a,#0d0d15);border-radius:12px;overflow:hidden;border:1px solid rgba(255,0,200,0.15)}
.video-placeholder{width:100%;aspect-ratio:9/16;background:linear-gradient(145deg,#1a0a2e,#0d0520);display:flex;align-items:center;justify-content:center}
.video-placeholder .play-icon{font-size:36px;color:#ff44cc;opacity:.6}
.video-info{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,0.5)}
.video-user{font-weight:600;color:#ff66dd;font-size:12px}
.video-actions{display:flex;gap:10px;align-items:center}
.video-actions button{background:0;border:0;color:#888;font-size:15px;cursor:pointer;transition:all .2s;padding:2px}
.video-actions button:hover{color:#ff44cc;transform:scale(1.1)}

.bottom-nav{display:flex;justify-content:space-around;align-items:center;padding:6px 0 12px 0;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,0,200,0.15);flex-shrink:0;position:sticky;bottom:0;z-index:20}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:0px;color:#555;font-size:9px;cursor:pointer;transition:all .3s;padding:2px 10px;border:0;background:0;font-family:inherit}
.nav-item .nav-icon{font-size:18px;transition:all .3s}
.nav-item.active{color:#ff44cc}
.nav-item.active .nav-icon{text-shadow:0 0 30px rgba(255,0,200,0.5)}

.movie-hero{background:linear-gradient(145deg,#1a0a2e,#0d0520);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid rgba(255,0,200,0.15)}
.movie-hero h2{color:#ff66dd;font-size:15px;margin-bottom:4px}
.movie-hero p{color:#aa66cc;font-size:11px}
.movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.movie-item{background:linear-gradient(145deg,#12121a,#0d0d15);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,0,200,0.08);transition:all .3s;cursor:pointer}
.movie-item:hover{border-color:rgba(255,0,200,0.4);box-shadow:0 0 25px rgba(255,0,200,0.1)}
.movie-item .movie-title{color:#ff88ee;font-weight:600;font-size:11px;margin-bottom:2px}
.movie-item .movie-year{color:#aa66cc;font-size:10px}
.movie-item .dl-badge{color:#ff44cc;font-size:10px;margin-top:4px}

.live-card{background:linear-gradient(145deg,#1a0a2e,#0d0520);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid rgba(255,0,200,0.1);display:flex;justify-content:space-between;align-items:center}
.live-card .live-status{color:#ff4444;font-size:10px;font-weight:700;text-transform:uppercase;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-card .live-title{color:#ff88ee;font-weight:600;font-size:13px}
.live-card .live-score{color:#ff44cc;font-weight:700;font-size:16px}

.download-input{display:flex;gap:8px;margin-bottom:14px}
.download-input input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,0,200,0.2);background:#12121a;color:#fff;font-size:13px;outline:0}
.download-input input:focus{border-color:#ff44cc;box-shadow:0 0 20px rgba(255,0,200,0.1)}
.download-input button{padding:10px 18px;border-radius:10px;border:0;background:linear-gradient(135deg,#ff44cc,#aa00cc);color:#fff;font-weight:700;cursor:pointer;transition:all .3s;font-size:13px}
.download-input button:hover{transform:scale(1.03);box-shadow:0 0 30px rgba(255,0,200,0.3)}

.profile-header{text-align:center;padding:14px 0}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ff44cc,#aa00cc);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;border:3px solid rgba(255,0,200,0.3);box-shadow:0 0 30px rgba(255,0,200,0.2)}
.profile-name{font-size:17px;font-weight:700;color:#ff88ee}
.profile-stats{display:flex;justify-content:center;gap:20px;margin:12px 0}
.profile-stats div{text-align:center}
.profile-stats .num{font-size:15px;font-weight:700;color:#ff44cc}
.profile-stats .label{font-size:10px;color:#aa66cc;text-transform:uppercase}

.creator-dash{background:linear-gradient(145deg,#1a0a2e,#0d0520);border-radius:12px;padding:12px;margin-top:12px;border:2px solid rgba(255,0,200,0.2)}
.creator-dash h3{color:#ff66dd;font-size:12px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.creator-dash .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.creator-dash .stat-row:last-child{border-bottom:0}
.creator-dash .stat-label{color:#aa66cc;font-size:12px}
.creator-dash .stat-value{color:#ff44cc;font-weight:700;font-size:12px}

.toggle-wrap{display:flex;align-items:center;gap:10px;padding:4px 0}
.toggle{width:40px;height:22px;background:#333;border-radius:11px;cursor:pointer;position:relative;transition:all .3s}
.toggle.on{background:#ff44cc;box-shadow:0 0 20px rgba(255,0,200,0.3)}
.toggle .knob{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:all .3s}
.toggle.on .knob{left:20px}

.search-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,0.95);z-index:100;display:none;flex-direction:column;padding:40px 20px}
.search-overlay.show{display:flex}
.search-overlay input{padding:16px;border-radius:12px;border:1px solid rgba(255,0,200,0.3);background:#12121a;color:#fff;font-size:18px;outline:0;margin-bottom:16px}
.search-overlay input:focus{border-color:#ff44cc;box-shadow:0 0 30px rgba(255,0,200,0.2)}
.search-overlay .close-btn{position:absolute;top:12px;right:16px;font-size:28px;color:#ff44cc;cursor:pointer;background:0;border:0}
.search-overlay .results{color:#aa66cc;font-size:14px}

::-webkit-scrollbar{width:0}
@media(min-width:768px){.movie-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.video-placeholder{aspect-ratio:16/9;max-height:350px}}
</style>
</head>
<body>
<div id="app">
<div class="header">
<span class="header-title">⬇️ X10</span>
<div class="header-right">
<button class="header-search" id="searchBtn">🔍</button>
<div class="header-account" id="headerAccount">👤</div>
</div>
</div>
<div class="sub-tabs" id="subTabs">
<span class="sub-tab active" data-page="fyp">For You</span>
<span class="sub-tab" data-page="movies">Movies</span>
</div>
<div class="content">
<div class="page active" id="page-fyp"><div class="video-feed" id="videoFeed"></div></div>
<div class="page" id="page-movies">
<div class="movie-hero"><h2>🎬 Featured Trailers</h2><p id="movieYearLabel">2026 & 2025</p></div>
<div class="movie-grid" id="movieGrid"></div>
</div>
<div class="page" id="page-live"><h2 style="color:#ff66dd;margin-bottom:12px;font-size:15px;">🔴 Live Now</h2><div id="liveList">
<div class="live-card"><div><div class="live-title">🏆 World Cup Final</div><div class="live-status">● LIVE</div></div><div class="live-score">3-1</div></div>
<div class="live-card"><div><div class="live-title">⚽ Premier League</div><div class="live-status" style="color:#ff88ee;">● CATCH-UP</div></div><div class="live-score">2-2</div></div>
</div></div>
<div class="page" id="page-download"><h2 style="color:#ff66dd;margin-bottom:12px;font-size:15px;">⬇️ Download</h2>
<div class="download-input"><input type="text" placeholder="Paste link..." id="downloadLink"><button onclick="startDownload()">Get</button></div>
<div id="downloadList"><p style="color:#aa66cc;font-size:12px;">No downloads yet.</p></div>
</div>
<div class="page" id="page-account">
<div class="profile-header"><div class="profile-avatar" id="profileAvatar">👤</div><div class="profile-name" id="profileName">User</div><div style="color:#aa66cc;font-size:11px;" id="profileId">Loading...</div></div>
<div class="profile-stats"><div><div class="num" id="followersCount">0</div><div class="label">Followers</div></div><div><div class="num" id="postsCount">0</div><div class="label">Posts</div></div><div><div class="num" id="repostsCount">0</div><div class="label">Reposts</div></div></div>
<div class="creator-dash" id="creatorDash" style="display:none;">
<h3>👑 Creator</h3>
<div class="stat-row"><span class="stat-label">Users</span><span class="stat-value" id="totalUsers">0</span></div>
<div class="stat-row"><span class="stat-label">Subscribers</span><span class="stat-value" id="totalSubs">0</span></div>
<div class="stat-row"><span class="stat-label">Monetization</span><div class="toggle-wrap"><div class="toggle" id="monetizeToggle" onclick="toggleMonetization()"><div class="knob"></div></div><span style="font-size:11px;color:#aa66cc;" id="monetizeLabel">OFF</span></div></div>
<div class="stat-row"><span class="stat-label">Revenue (₦)</span><span class="stat-value" id="revenueDisplay">0</span></div>
</div>
</div>
</div>

<div class="search-overlay" id="searchOverlay">
<button class="close-btn" id="closeSearch">✕</button>
<input type="text" id="searchInput" placeholder="Search videos, movies...">
<div class="results" id="searchResults">Type to search...</div>
</div>

<div class="bottom-nav" id="bottomNav">
<button class="nav-item active" data-tab="home"><span class="nav-icon">🏠</span>Home</button>
<button class="nav-item" data-tab="live"><span class="nav-icon">🔴</span>Live</button>
<button class="nav-item" data-tab="download"><span class="nav-icon">⬇️</span>DL</button>
<button class="nav-item" data-tab="account"><span class="nav-icon">👤</span>Account</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5i1Nda3IU1SZQ_1LLxmVSE";
const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CREATOR_ID = "f05ebc04-793b-42fe-a07b-08568a9c2206";

const APP_VERSION = "1.0.3";
const STORED_VERSION = localStorage.getItem('x10_version');
if (STORED_VERSION && STORED_VERSION !== APP_VERSION) {
    alert("📢 New update available! Refreshing...");
    localStorage.setItem('x10_version', APP_VERSION);
    location.reload();
} else if (!STORED_VERSION) {
    localStorage.setItem('x10_version', APP_VERSION);
}
console.log("✅ App Version:", APP_VERSION);

let currentUser = null;
let currentTab = 'home';
let monetizationOn = false;

const currentYear = new Date().getFullYear();
const previousYear = currentYear - 1;
document.getElementById('movieYearLabel').textContent = currentYear + ' & ' + previousYear;

const sampleVideos = [
    { id: 1, user: '@x10_creator', likes: 24, comments: 5 },
    { id: 2, user: '@tech_fan', likes: 18, comments: 3 },
    { id: 3, user: '@movie_buff', likes: 42, comments: 8 },
    { id: 4, user: '@live_sports', likes: 31, comments: 6 }
];

const sampleMovies = [
    { title: 'Man of War', year: currentYear, category: 'Action' },
    { title: 'Enola Holmes 3', year: currentYear, category: 'Mystery' },
    { title: 'Phambili Nge Gwijo', year: currentYear, category: 'Drama' },
    { title: 'Mortal Kombat II', year: previousYear, category: 'Action' },
    { title: 'Citizen Vigilante', year: previousYear, category: 'Thriller' },
    { title: 'Obsession', year: previousYear, category: 'Horror' }
];

function renderVideos() {
    const feed = document.getElementById('videoFeed');
    feed.innerHTML = sampleVideos.map(v => `
        <div class="video-card">
            <div class="video-placeholder"><span class="play-icon">▶️</span></div>
            <div class="video-info">
                <span class="video-user">${v.user}</span>
                <div class="video-actions">
                    <button onclick="handleLike(${v.id})">❤️ ${v.likes}</button>
                    <button onclick="handleComment(${v.id})">💬 ${v.comments}</button>
                    <button onclick="handlePin(${v.id})">📌</button>
                    <button onclick="handleShare(${v.id})">↗️</button>
                </div>
            </div>
        </div>
    `).join('');
}

function renderMovies() {
    const grid = document.getElementById('movieGrid');
    grid.innerHTML = sampleMovies.map(m => `
        <div class="movie-item" onclick="watchMovie('${m.title}')">
            <div class="movie-title">${m.title}</div>
            <div class="movie-year">${m.year} • ${m.category}</div>
            <div class="dl-badge">⬇️ Download</div>
        </div>
    `).join('');
}

function handleLike(id) { alert('❤️ Liked video #' + id); }
function handleComment(id) { const m = prompt('💬 Comment:'); if (m) alert('Comment: ' + m); }
function handlePin(id) { alert('📌 Pinned #' + id); }
function handleShare(id) { alert('↗️ Shared #' + id); }
function watchMovie(t) { alert('🎬 Playing: ' + t); }
function startDownload() {
    const l = document.getElementById('downloadLink').value;
    if (!l) { alert('Paste a link first.'); return; }
    alert('⬇️ Downloading: ' + l);
    document.getElementById('downloadLink').value = '';
}

document.getElementById('searchBtn').addEventListener('click', function() {
    document.getElementById('searchOverlay').classList.add('show');
    document.getElementById('searchInput').focus();
});
document.getElementById('closeSearch').addEventListener('click', function() {
    document.getElementById('searchOverlay').classList.remove('show');
});
document.getElementById('searchInput').addEventListener('input', function() {
    const query = this.value.toLowerCase();
    const results = document.getElementById('searchResults');
    if (!query) { results.innerHTML = 'Type to search...'; return; }
    const videoResults = sampleVideos.filter(v => v.user.toLowerCase().includes(query));
    const movieResults = sampleMovies.filter(m => m.title.toLowerCase().includes(query));
    let html = '';
    if (videoResults.length) {
        html += '<div style="color:#ff66dd;margin:8px 0;">📹 Videos</div>';
        videoResults.forEach(v => { html += `<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);color:#ff88ee;">${v.user}</div>`; });
    }
    if (movieResults.length) {
        html += '<div style="color:#ff66dd;margin:8px 0;">🎬 Movies</div>';
        movieResults.forEach(m => { html += `<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);color:#ff88ee;">${m.title} (${m.year})</div>`; });
    }
    if (!videoResults.length && !movieResults.length) {
        html = '<span style="color:#aa66cc;">No results found.</span>';
    }
    results.innerHTML = html;
});

function navigateTo(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const pageMap = { 'home': 'page-fyp', 'live': 'page-live', 'download': 'page-download', 'account': 'page-account' };
    const target = document.getElementById(pageMap[tab]);
    if (target) target.classList.add('active');
    document.getElementById('subTabs').style.display = (tab === 'home') ? 'flex' : 'none';
    if (tab === 'account') loadAccountData();
}

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(this.dataset.tab);
        });
    });
    document.querySelectorAll('.sub-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            const page = this.dataset.page;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
        });
    });
    document.getElementById('headerAccount').addEventListener('click', function() {
        navigateTo('account');
    });
    renderVideos();
    renderMovies();
    console.log('✅ X10 Downloader loaded!');
});

async function loadAccountData() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
        document.getElementById('profileName').textContent = 'Not Signed In';
        document.getElementById('profileId').textContent = 'Tap to login';
        document.getElementById('profileAvatar').textContent = '🔒';
        return;
    }
    currentUser = user;
    const isCreator = user.id === CREATOR_ID;
    document.getElementById('profileName').textContent = user.user_metadata?.full_name || user.email || 'User';
    document.getElementById('profileId').textContent = '@' + (user.user_metadata?.username || 'user');
    document.getElementById('profileAvatar').textContent = (user.user_metadata?.full_name || 'U')[0].toUpperCase();
    if (isCreator) {
        document.getElementById('creatorDash').style.display = 'block';
        loadAnalytics();
    } else {
        document.getElementById('creatorDash').style.display = 'none';
    }
}

function loadAnalytics() {
    document.getElementById('totalUsers').textContent = '47';
    document.getElementById('totalSubs').textContent = '12';
    document.getElementById('revenueDisplay').textContent = '₦8,400';
}

function toggleMonetization() {
    const toggle = document.getElementById('monetizeToggle');
    const label = document.getElementById('monetizeLabel');
    monetizationOn = !monetizationOn;
    toggle.classList.toggle('on', monetizationOn);
    label.textContent = monetizationOn ? 'ON' : 'OFF';
    label.style.color = monetizationOn ? '#ff44cc' : '#aa66cc';
    alert('💰 Monetization ' + (monetizationOn ? 'ENABLED' : 'DISABLED'));
}

let exitTimer = 0;
window.addEventListener('popstate', function(e) {
    if (exitTimer === 0) {
        exitTimer = 1;
        setTimeout(() => { exitTimer = 0; }, 500);
    } else {
        if (confirm('Exit X10 Downloader?')) { window.close(); }
        exitTimer = 0;
    }
});
history.pushState({ page: 'home' }, '');

console.log('🚀 X10 Downloader ready!');
</script>
</body>
</html>
