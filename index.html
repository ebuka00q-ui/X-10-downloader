<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>X10 Downloader</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #0a0a0f; color: white; overflow: hidden; /* Locks the screen */
            font-family: sans-serif;
        }
        .app-shell { display: flex; flex-direction: column; height: 100vh; }
        
        /* Fixed Header */
        header { padding: 20px; background: #111; border-bottom: 2px solid #ff007f; }
        input { width: 90%; padding: 12px; border-radius: 8px; border: none; background: #252535; color: white; }
        
        /* Scrolling area for videos only */
        #video-container { flex: 1; overflow-y: auto; padding: 10px; }
        
        /* Fixed Footer */
        footer { height: 60px; display: flex; background: #111; border-top: 1px solid #333; }
        .nav-btn { flex: 1; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <input type="text" id="searchInput" placeholder="Search movies...">
    </header>
    
    <div id="video-container">
        </div>

    <footer>
        <div class="nav-btn">Movie</div>
        <div class="nav-btn">Download</div>
    </footer>
</div>
</body>
</html>
