<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 DOWNLOADER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .page { display: none; }
        .page.active { display: block; }
        .feed { height: 75vh; overflow-y: auto; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#0b0813] text-white font-sans min-h-screen pb-20">

    <div id="search-zone" class="p-4 bg-[#130f22] border-b border-white/10 sticky top-0 z-50">
        <div class="flex gap-2">
            <input id="search-input" type="text" placeholder="Search movie..." class="flex-1 bg-black p-2 rounded text-xs border border-white/10">
            <button onclick="runSearch()" class="bg-indigo-600 px-4 rounded text-xs font-bold">GO</button>
        </div>
    </div>

    <main class="p-4">
        <div id="page-home" class="page active">
            <div class="flex gap-4 mb-4 border-b border-white/10 pb-2">
                <button onclick="switchSub('fyp')" class="text-xs font-bold text-indigo-400">FYP</button>
                <button onclick="switchSub('movies')" class="text-xs font-bold text-gray-400">MOVIES</button>
            </div>
            <div id="fyp-list" class="feed space-y-4"></div>
            <div id="movies-list" class="feed space-y-4 hidden"></div>
        </div>

        <div id="page-live" class="page">
            <h2 class="text-emerald-400 text-xs font-bold mb-4">LIVE RELAYS</h2>
            <div id="live-list" class="space-y-3"></div>
        </div>

        <div id="page-downloads" class="page">
            <h2 class="text-indigo-400 text-xs font-bold mb-4">MY LIBRARY</h2>
            <p class="text-[10px] text-gray-500 mb-2">OFFLINE STORAGE</p>
            <div id="dwn-list" class="space-y-2"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-black p-4 flex justify-around text-[10px] font-bold border-t border-white/5 z-50">
        <button onclick="nav('home')">HOME</button>
        <button onclick="nav('live')">LIVE</button>
        <button onclick="nav('downloads')">DOWNLOADS</button>
    </nav>

    <script>
        const data = [
            {t:'Big Buck Bunny',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'},
            {t:'Sintel',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'}
        ];

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('search-zone').style.display = (id === 'downloads') ? 'none' : 'block';
        }

        function switchSub(id) {
            document.getElementById('fyp-list').classList.toggle('hidden', id !== 'fyp');
            document.getElementById('movies-list').classList.toggle('hidden', id !== 'movies');
        }

        function runSearch() {
            let q = document.getElementById('search-input').value;
            if(!q) return;
            alert("Searching: " + q);
            document.getElementById('search-input').value = '';
        }

        function download(item) {
            let saved = JSON.parse(localStorage.getItem('x10_dwn') || '[]');
            saved.push(item);
            localStorage.setItem('x10_dwn', JSON.stringify(saved));
            renderDownloads();
            alert("Saved to Offline Storage");
        }

        function renderDownloads() {
            const list = document.getElementById('dwn-list');
            const saved = JSON.parse(localStorage.getItem('x10_dwn') || '[]');
            list.innerHTML = saved.map(i => `<div class="p-3 bg-[#130f22] rounded text-xs">✅ ${i.t}</div>`).join('');
        }

        // Initialize Feed
        const fyp = document.getElementById('fyp-list');
        data.forEach(v => {
            let div = document.createElement('div');
            div.className = 'bg-black rounded-lg overflow-hidden border border-white/10';
            div.innerHTML = `<video class="w-full aspect-video" controls src="${v.s}"></video>
                             <div class="p-2 flex justify-between items-center"><span class="text-xs">${v.t}</span>
                             <button onclick='download(${JSON.stringify(v)})' class="bg-emerald-600 px-3 py-1 rounded text-[10px]">SAVE</button></div>`;
            fyp.appendChild(div);
        });

        renderDownloads();
    </script>
</body>
</html>
