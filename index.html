<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>X10 Downloader</title>

    <link rel="manifest" href='data:application/json,{"name":"X10 Downloader","short_name":"X10","start_url":"/","display":"standalone","background_color":"#0a0a0a"}'>
    <style>
        :root { --primary: #ff007f; --bg: #0a0a0a; --txt: #ffffff; --grey: #888888; }
        * { box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; background: var(--bg); color: var(--txt); font-family: sans-serif; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Top UI Header - RESTORED */
        #header-container { flex: 0 0 16vh; display: flex; flex-direction: column; padding: 0 4vw; border-bottom: 1px solid #333; background: #111; }
        #search-box { display: flex; align-items: center; padding-top: 2vh; }
        #search-input { flex: 1; padding: 1.5vh; border-radius: 5px; border: none; background: #222; color: white; }
        #go-btn { background: var(--primary); color: white; border: none; padding: 1.5vh 6vw; margin-left: 2vw; border-radius: 5px; font-weight: bold; }
        #tab-row { text-align: center; padding: 2vh 0; color: var(--primary); font-weight: bold; font-size: 3.5vw; }

        /* Main Content */
        .panel { display: none; flex: 1; overflow-y: auto; padding: 2vh; }
        .panel.active { display: block; }
        
        /* Video Card */
        .video-wrapper { position: relative; width: 100%; height: 78vh; background: #000; border-radius: 10px; overflow: hidden; }
        
        /* Social Stack - UPDATED */
        .social-stack { position: absolute; right: 3vw; bottom: 15vh; display: flex; flex-direction: column; gap: 3vh; z-index: 10; }
        .stack-item { cursor: pointer; text-align: center; color: var(--txt); transition: color 0.2s; }
        .icon { font-size: 7vw; display: block; }
        .label { font-size: 2.5vw; }
        .liked { color: var(--primary); }
        .pinned { color: #3498db; } /* Pin remains blue */
        /* Share is now primary pink */
        #share-btn-icon { color: var(--primary); }

        /* Bottom Nav - UPDATED Text */
        nav { flex: 0 0 10vh; background: #000; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { text-align: center; color: var(--grey); cursor: pointer; }
        .nav-btn.active { color: var(--primary); }
        .nav-icon { font-size: 4vw; display: block; }
        .nav-label { font-size: 2.5vw; }
    </style>
</head>
<body>

<div id="header-container">
    <div id="search-box">
        <input type="text" id="search-input" placeholder="Search For You...">
        <button id="go-btn" onclick="performSearch()">GO</button>
    </div>
    <div id="tab-row">FOR YOU | MOVIES</div>
</div>

<div id="home-panel" class="panel active">
    <div class="video-wrapper">
        <video src="" width="100%" height="100%" controls style="object-fit:cover;"></video>
        <div class="social-stack">
            <div class="stack-item" onclick="this.classList.toggle('liked')">
                <span class="icon">❤️</span><span class="label">Like</span>
            </div>
            <div class="stack-item" onclick="alert('Open Comments')">
                <span class="icon">💬</span><span class="label">Comment</span>
            </div>
            <div class="stack-item" onclick="this.classList.toggle('pinned')">
                <span class="icon">📌</span><span class="label">Pin</span>
            </div>
            <div class="stack-item" onclick="document.getElementById('file-upload').click()">
                <span class="icon">➕</span><span class="label">Upload</span>
            </div>
            <input type="file" id="file-upload" style="display:none" accept="video/*">
            
            <div class="stack-item" onclick="alert('Share Link Copied')">
                <span class="icon" id="share-btn-icon">➤</span><span class="label">Share</span>
            </div>
        </div>
    </div>
</div>

<div id="live-panel" class="panel"><h2>Live Streams</h2></div>
<div id="dl-panel" class="panel"><h2>Download Manager</h2></div>
<div id="acc-panel" class="panel"><h2>Account</h2></div>

<nav>
    <div class="nav-btn active" onclick="switchPanel('home', this)">
        <span class="nav-icon">🏠</span><span class="nav-label">HOME</span>
    </div>
    <div class="nav-btn" onclick="switchPanel('live', this)">
        <span class="nav-icon">📡</span><span class="nav-label">LIVE</span>
    </div>
    <div class="nav-btn" onclick="switchPanel('dl', this)">
        <span class="nav-icon">📥</span><span class="nav-label">Download</span>
    </div>
    <div class="nav-btn" onclick="switchPanel('acc', this)">
        <span class="nav-icon">👤</span><span class="nav-label">ACCOUNT</span>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

    const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";

    // Panel Switching Engine
