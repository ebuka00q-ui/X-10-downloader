        </div>
    </div>

    <main class="p-4">
        <div id="page-home" class="page active">
            <h2 class="text-indigo-400 font-bold mb-4 border-l-4 border-indigo-500 pl-2 text-xs uppercase">For You Feed</h2>
            <div id="home-content" class="min-h-[50vh] bg-[#0b0813]/40 rounded-xl border border-indigo-900/50 p-4"></div>
        </div>

        <div id="page-live" class="page">
            <h2 class="text-emerald-400 font-bold mb-4 border-l-4 border-emerald-500 pl-2 text-xs uppercase">Live Relays</h2>
            <div id="live-content" class="min-h-[50vh] bg-[#0b0813]/40 rounded-xl border border-emerald-900/50 p-4"></div>
        </div>

        <div id="page-library" class="page">
            <h2 class="text-purple-400 font-bold mb-4 border-l-4 border-purple-500 pl-2 text-xs uppercase">My Library</h2>
            <div id="lib-content" class="min-h-[50vh] bg-[#0b0813]/40 rounded-xl border border-purple-900/50 p-4"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-[#0b0813] p-4 flex justify-around border-t border-indigo-900 z-50">
        <button onclick="nav('home')" id="btn-home" class="nav-link active text-[10px]">HOME</button>
        <button onclick="nav('live')" id="btn-live" class="nav-link text-[10px]">LIVE</button>
        <button onclick="nav('library')" id="btn-library" class="nav-link text-[10px]">LIBRARY</button>
    </nav>

    <script>
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            document.getElementById('search-zone').style.display = (id === 'library') ? 'none' : 'block';
        }
    </script>
</body>
</html>
