<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Layout Configuration */
        body { font-family: sans-serif; margin: 0; height: 100%; display: flex; flex-direction: column; background: #121212; color: white; }
        .view { flex: 1; overflow-y: auto; display: none; padding: 20px; }
        #view-home { display: block; }
        
        /* Navigation Styling */
        nav { background: #1f1f1f; padding: 15px; display: flex; justify-content: space-around; border-top: 1px solid #333; }
        .nav-btn { color: #aaa; cursor: pointer; font-weight: bold; }
        .nav-btn.active { color: #007bff; }
        
        /* Search & Elements */
        .search-container { padding: 15px; background: #1f1f1f; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 5px; border: none; }
        .video-box { width: 100%; height: 250px; background: #000; display: flex; align-items: center; justify-content: center; margin-top: 10px; border: 2px solid #333; }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="search" placeholder="Search for movies..." oninput="handleSearch()">
    </div>

    <div id="view-home" class="view">
        <h1>FYP Feed</h1>
        <div id="results"></div>
    </div>
    
    <div id="view-movie" class="view">
        <h1>Movie Player</h1>
        <div class="video-box" id="player">VIDEO PLAYER AREA</div>
        <button onclick="show('view-home')" style="margin-top: 10px;">Back to Feed</button>
    </div>

    <div id="view-live" class="view"><h1>Live Stream</h1><div class="video-box">LIVE STREAM</div></div>

    <nav id="navBar">
        <div class="nav-btn active" onclick="show('view-home', this)">Home</div>
        <div class="nav-btn" onclick="show('view-movie', this)">Movie</div>
        <div class="nav-btn" onclick="show('view-live', this)">Live</div>
    </nav>

    <script>
        // Navigation Logic
        function show(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        // Search Logic
        function handleSearch() {
            const q = document.getElementById('search').value;
            document.getElementById('results').innerHTML = q.length > 2 ? 
                `<div style="padding:10px; background:#222; margin-top:10px;">
                    <p>Results for: ${q}</p>
                    <button onclick="show('view-movie')">Watch Now</button>
                 </div>` : '';
        }

        // Audit/Update System
        function checkForUpdates() {
            var version = "1.0.5";
            var lastUpdate = "2026-07-03";
            console.log("Audit Active | Version: " + version + " | Last Update: " + lastUpdate);
            // Link your server status logic here
        }

        window.onload = checkForUpdates;
    </script>
</body>
</html>
