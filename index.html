<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        #app-content { flex: 1; display: flex; justify-content: center; align-items: center; }
        .nav-bar { display: flex; justify-content: space-around; padding: 15px; border-top: 2px solid #FF00FF; background: #000; }
        .nav-btn { color: #fff; cursor: pointer; border: 1px solid #333; padding: 5px 10px; }
        .active-btn { border-color: #FF00FF; color: #FF00FF; }
        .admin-stat { color: #FF00FF; font-weight: bold; font-size: 24px; text-align: center; }
    </style>
</head>
<body>

    <div id="app-content">
        <div id="HOME-panel" class="panel">HOME FEED</div>
        <div id="LIVE-panel" class="panel" style="display:none;">LIVE: SPAIN MATCH BROADCAST</div>
        <div id="DOWNLOAD-panel" class="panel" style="display:none;">DOWNLOADS</div>
        <div id="ACCOUNT-panel" class="panel" style="display:none;">
            <div id="follower-display" class="admin-stat">100,000,000 Followers</div>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn" onclick="switchTab('HOME')">HOME</button>
        <button class="nav-btn" onclick="switchTab('LIVE')">LIVE</button>
        <button class="nav-btn" onclick="switchTab('DOWNLOAD')">DOWNLOAD</button>
        <button class="nav-btn" onclick="switchTab('ACCOUNT')">ACCOUNT</button>
    </nav>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
        const ADMIN_UID = "PASTE_YOUR_SPECIFIC_ADMIN_ID_HERE";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 2. LOGIC ---
        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user && user.id === ADMIN_UID) {
                document.getElementById('follower-display').innerText = "100,000,000 Followers";
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            document.getElementById(tab + '-panel').style.display = 'block';
        }

        init();
    </script>
</body>
</html>
