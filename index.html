<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Downloader</title>
    <link rel="manifest" href="manifest.json">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-pink: #ff00ff; --deep-black: #000000; }
        body, html { margin: 0; padding: 0; background: var(--deep-black); color: #fff; font-family: sans-serif; height: 100%; overflow: hidden; }
        
        #search-container { position: fixed; top: 0; width: 100%; height: 60px; background: #000; display: flex; align-items: center; padding: 10px; z-index: 1000; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; background: #222; color: white; }
        
        .panel { display: none; height: 100vh; padding-top: 70px; padding-bottom: 70px; overflow-y: auto; }
        .panel.active { display: block; }
        
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 1000; }
        .nav-btn { background: none; border: none; color: #888; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: var(--neon-pink); }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Search...">
        <button id="search-btn" style="margin-left:10px; background:var(--neon-pink); border:none; padding:10px 15px; color:white; border-radius:5px;">GO</button>
    </div>

    <div id="home-panel" class="panel active"><h1>For You</h1></div>
    <div id="live-panel" class="panel"><h1>Live Streams</h1></div>
    <div id="download-panel" class="panel"><h1>Downloads</h1></div>
    <div id="account-panel" class="panel"><h1>Account</h1></div>

    <nav>
        <button class="nav-btn active" onclick="switchPanel('home-panel', this)">Home</button>
        <button class="nav-btn" onclick="switchPanel('live-panel', this)">Live</button>
        <button class="nav-btn" onclick="switchPanel('download-panel', this)">Download</button>
        <button class="nav-btn" onclick="switchPanel('account-panel', this)">Account</button>
    </nav>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Panel Switching Engine
        function switchPanel(id, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            
            // Search Bar Visibility Logic
            const searchBar = document.getElementById('search-container');
            if(id === 'download-panel' || id === 'account-panel') {
                searchBar.style.display = 'none';
            } else {
                searchBar.style.display = 'flex';
            }
        }

        // Search Trigger
        document.getElementById('search-btn').addEventListener('click', () => {
            const query = document.getElementById('search-input').value;
            alert("Searching for: " + query);
        });
    </script>
</body>
</html>
