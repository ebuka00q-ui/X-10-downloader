<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Global Engine</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-pink: #ff00ff; --bg-black: #000000; --text-grey: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-black); color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; width: 100vw; }
        
        .panel { display: none; height: 100vh; padding: 110px 15px 70px 15px; overflow-y: auto; }
        .panel.active { display: block !important; }
        
        #top-bar { position: fixed; top: 0; width: 100%; height: 60px; background: #000; display: flex; align-items: center; padding: 10px; z-index: 1000; border-bottom: 1px solid #333; }
        #nav-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 1px solid #333; }
        
        #account-search-icon { display: none; cursor: pointer; font-size: 1.5rem; color: var(--neon-pink); }
        .nav-btn { background: none; border: none; color: var(--text-grey); font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: var(--neon-pink); }
    </style>
</head>
<body>

    <div id="top-bar">
        <input type="text" id="main-search" placeholder="Search..." style="flex:1; padding:10px; background:#222; color:white; border:none; border-radius:5px;">
        <div id="account-search-icon" onclick="alert('Search your Friends')">🔍</div>
        <button id="search-go" onclick="runSearch()" style="margin-left:5px; background:var(--neon-pink); border:none; padding:10px; color:white; border-radius:5px;">GO</button>
    </div>

    <div id="home-panel" class="panel active"><h1>Social/Movie Feed</h1></div>
    <div id="live-panel" class="panel"><h1>Live/Previous Matches</h1></div>
    <div id="download-panel" class="panel"><h1>Downloads</h1></div>
    <div id="account-panel" class="panel"><div style="text-align:center;"><h1>@CreatorMaster</h1></div></div>

    <div id="nav-bar">
        <button class="nav-btn active" onclick="switchPanel('home-panel', this)">Home</button>
        <button class="nav-btn" onclick="switchPanel('live-panel', this)">Live</button>
        <button class="nav-btn" onclick="switchPanel('download-panel', this)">Download</button>
        <button class="nav-btn" onclick="switchPanel('account-panel', this)">Account</button>
    </div>

    <script>
        // GLOBAL SUPABASE KEY
        const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
        window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchPanel(id, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');

            const sb = document.getElementById('main-search');
            const sg = document.getElementById('search-go');
            const si = document.getElementById('account-search-icon');

            if(id === 'account-panel') {
                sb.style.display = 'none'; sg.style.display = 'none'; si.style.display = 'block';
            } else if(id === 'download-panel') {
                sb.style.display = 'none'; sg.style.display = 'none'; si.style.display = 'none';
            } else {
                sb.style.display = 'block'; sg.style.display = 'block'; si.style.display = 'none';
            }
        }

        function runSearch() {
            const panel = document.querySelector('.panel.active').id;
            const query = document.getElementById('main-search').value;
            alert(`Scoped Search: Searching ${panel} for "${query}"`);
        }
    </script>
</body>
</html>
