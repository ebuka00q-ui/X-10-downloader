<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 1. Reset everything to lock to the screen */
        * { box-sizing: border-box; touch-action: manipulation; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0f; color: white; font-family: sans-serif; }
        
        /* 2. The App Shell Layout */
        .app-shell { display: flex; flex-direction: column; height: 100vh; }
        
        header { height: 70px; padding: 15px; border-bottom: 1px solid #ff007f; display: flex; align-items: center; }
        #search-input { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #1a1a24; color: white; }
        
        #view-area { flex: 1; overflow-y: auto; padding: 15px; }
        
        footer { height: 60px; display: flex; border-top: 1px solid #ff007f; background: #111; }
        .nav-btn { flex: 1; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #ff007f; font-weight: bold; }
        
        .card { background: #1a1a24; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <input type="text" id="search-input" placeholder="Search...">
    </header>

    <div id="view-area">
        <div id="content-display">Loading...</div>
    </div>

    <footer>
        <div class="nav-btn" onclick="render('movie')">MOVIE</div>
        <div class="nav-btn" onclick="render('download')">DOWNLOAD</div>
    </footer>
</div>

<script>
    const supabase = supabase.createClient("https://gkfivuvtpfetzatz.supabase.co", "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE");

    async function render(view) {
        const display = document.getElementById('content-display');
        if (view === 'movie') {
            const { data } = await supabase.from('videos').select('*');
            display.innerHTML = data.map(v => `<div class="card">${v.title}</div>`).join('');
        } else {
            display.innerHTML = '<div class="card">No downloads yet.</div>';
        }
    }

    render('movie'); // Initial load
</script>
</body>
</html>
