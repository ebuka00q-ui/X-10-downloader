<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X10 Movies</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white m-0 p-0 h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;
    const supabase = createClient("https://gkfivuvtpfetzatz.supabase.co", "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE");

    const MovieApp = () => {
      const [allMovies, setAllMovies] = useState([]);
      const [displayMovies, setDisplayMovies] = useState([]);
      const [searchText, setSearchText] = useState('');

      useEffect(() => {
        const fetchMovies = async () => {
          const { data } = await supabase.from('movies').select('*');
          if (data) {
            setAllMovies(data);
            setDisplayMovies(data);
          }
        };
        fetchMovies();
      }, []);

      // Trigger Search only when button is clicked
      const handleSearch = () => {
        if (!searchText.trim()) {
          setDisplayMovies(allMovies);
        } else {
          setDisplayMovies(allMovies.filter(m => 
            m.title.toLowerCase().includes(searchText.toLowerCase())
          ));
        }
      };

      return (
        <div className="flex flex-col h-full bg-black">
          {/* Top Search Panel */}
          <div className="p-4 bg-black border-b border-gray-800 flex gap-2">
            <input 
              type="text" 
              placeholder="Search movie title..." 
              className="flex-1 bg-gray-900 p-3 rounded-lg text-white"
              value={searchText}
              onChange={(e) => setSearchText(e.target.value)}
            />
            <button 
              onClick={handleSearch}
              className="bg-blue-600 px-6 py-2 rounded-lg font-bold"
            >
              SEARCH
            </button>
          </div>

          {/* Scrollable Movie Grid */}
          <main className="flex-1 overflow-y-auto p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {displayMovies.map(movie => (
              <div key={movie.id} className="bg-[#111111] p-4 rounded-2xl border border-gray-800">
                <video className="w-full rounded-lg bg-black" controls playsInline>
                  <source src={movie.video_url} type="video/mp4" />
                </video>
                <h2 className="mt-3 text-lg font-bold truncate">{movie.title}</h2>
              </div>
            ))}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MovieApp />);
  </script>
</body>
</html>
