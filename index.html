<!DOCTYPE html>
<html lang="en" style="height: 100%; width: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: linear-gradient(135deg, #0a0a0a 0%, #1a0b2e 100%); color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #view-container { flex: 1; overflow-y: auto; padding: 20px; }
        .search-trigger { background: #1f1f1f; padding: 15px; border-radius: 12px; border: 1px solid #444; margin-bottom: 20px; color: #aaa; cursor: pointer; }
        
        nav { background: #000; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #333; position: sticky; bottom: 0; }
        .nav-btn { color: #888; transition: 0.3s; cursor: pointer; font-weight: bold; }
        .nav-btn.active { color: #ff007f; text-shadow: 0 0 10px #ff007f; }

        .content-card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="view-container">
        <!-- Home View -->
        <div id="view-home" class="view">
            <div class="search-trigger" onclick="alert('Search Active')">Search movies, shows, links...</div>
            <h2 id="year-header">Trending Now</h2>
            <div id="feed-content">
                <div class="content-card">Dynamic Movie Entry 1</div>
                <div class="content-card">Dynamic Movie Entry 2</div>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-btn active" onclick="switchTab(this, 'home')">Home</div>
        <div class="nav-btn" onclick="switchTab(this, 'live')">Live</div>
        <div class="nav-btn" onclick="switchTab(this, 'downloads')">Downloads</div>
    </nav>

    <script>
        // Set dynamic year for Trending Header
        document.getElementById('year-header').innerText = "Trending Now (" + new Date().getFullYear() + ")";

        // Navigation Logic with Tactile Feedback
        function switchTab(el, tabId) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            console.log("Navigating to: " + tabId);
        }

        // Double-Back Exit Logic
        let backCount = 0;
        window.addEventListener('popstate', function() {
            if (backCount === 0) {
                alert("Press back again to exit");
                backCount++;
                setTimeout(() => backCount = 0, 2000);
            } else {
                window.history.back();
            }
        });
    </script>
</body>
</html>
