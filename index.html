<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Professional Reset */
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100%; }
        
        /* Search Bar */
        .search-container { padding: 15px; background: #0a0a0a; }
        .search-input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #FF00FF; background: #111; color: #fff; font-size: 16px; }

        /* Content Panels */
        .content { flex: 1; overflow-y: auto; padding: 20px; }
        .panel { display: none; }
        .panel.active { display: block; }
        
        /* Professional Navigation */
        .nav-bar { display: flex; justify-content: space-between; padding: 15px 25px; border-top: 2px solid #FF00FF; background: #000; }
        .nav-btn { color: #fff; background: none; border: none; font-size: 14px; font-weight: 600; cursor: pointer; text-transform: uppercase; }
        .nav-btn.active { color: #FF00FF; }
        
        /* Social Messaging (Private until followed) */
        .social-feed { display: flex; flex-direction: column; gap: 10px; }
        .chat-user { padding: 15px; background: #111; border-radius: 8px; border-left: 4px solid #FF00FF; }
    </style>
</head>
<body>

<div id="app">
    <div class="search-container">
        <input type="text" class="search-input" placeholder="Search movies or creators...">
    </div>
    
    <div class="content">
        <div id="HOME" class="panel active">
            <h2 style="color:#FF00FF;">For You</h2>
            <p>Swipe up to view content...</p>
        </div>
        <div id="LIVE" class="panel">
            <h2 style="color:#FF00FF;">Live Match</h2>
            <p>Spain Broadcast: Second Half Starting Soon.</p>
        </div>
        <div id="DOWNLOAD" class="panel">
            <h2 style="color:#FF00FF;">My Downloads</h2>
            <p>Your saved media list is empty.</p>
        </div>
        <div id="ACCOUNT" class="panel">
            <h2 style="color:#FF00FF;">Profile</h2>
            <div id="follower-display" style="font-size: 20px; font-weight: bold;">100,000,000 Followers</div>
            <div class="social-feed" style="margin-top:20px;">
                <h3 style="color:#FF00FF;">Messages</h3>
                <div class="chat-user">Mutual Friend: "Ready for the match?"</div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="switchTab('HOME', this)">Home</button>
        <button class="nav-btn" onclick="switchTab('LIVE', this)">Live</button>
        <button class="nav-btn" onclick="switchTab('DOWNLOAD', this)">Download</button>
        <button class="nav-btn" onclick="switchTab('ACCOUNT', this)">Account</button>
    </nav>
</div>

<script>
    const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
    const ADMIN_UID = "PASTE_YOUR_ID_HERE";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function switchTab(id, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    async function init() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user && user.id === ADMIN_UID) {
            document.getElementById('follower-display').innerText = "100,000,000 Followers";
        }
    }
    init();
</script>
</body>
</html>
