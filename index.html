<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>X10 Downloader</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">

    <!-- Icons -->
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sports.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/ai.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="app">

    <!-- Header -->
    <header class="header">

        <div class="logo">

            ⬇️ X10 Downloader

        </div>

        <button id="profileButton">

            👤

        </button>

    </header>

    <!-- Gender Tabs -->

    <div class="genderTabs">

        <button id="maleTab" class="active">

            MEN

        </button>

        <button id="femaleTab">

            WOMEN

        </button>

    </div>

    <!-- Main Pages -->

    <main id="pages">

        <section id="homePage"></section>

        <section id="sportsPage"></section>

        <section id="favoritesPage"></section>

        <section id="watchPage"></section>

        <section id="accountPage"></section>

        <section id="aiPage"></section>

    </main>

    <!-- Bottom Navigation -->

    <nav class="bottomNav">

        <button data-page="home">

            🏠
            <span>Home</span>

        </button>

        <button data-page="sports">

            ⚽
            <span>Sports</span>

        </button>

        <button data-page="favorites">

            ⭐
            <span>Favorites</span>

        </button>

        <button data-page="watch">

            ▶
            <span>Watch</span>

        </button>

        <button data-page="account">

            👤
            <span>Account</span>

        </button>

    </nav>

</div>

<!-- JavaScript -->

<script src="js/config.js"></script>

<script src="js/storage.js"></script>

<script src="js/app.js"></script>

<script src="js/sports.js"></script>

<script src="js/favorites.js"></script>

<script src="js/watch.js"></script>

<script src="js/profile.js"></script>

<script src="js/notifications.js"></script>

<script src="js/ai.js"></script>

</body>
    </html>
