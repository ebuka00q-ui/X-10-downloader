<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>X10 Downloader</title>
    <link rel="manifest" href='data:application/json,{"name":"X10 Downloader","short_name":"X10","start_url":"/","display":"standalone","background_color":"#0a0a0a"}'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --primary: #ff007f; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        #app { height: 100vh; display: flex; flex-direction: column; }
        
        #view-feed, #view-profile, #view-upload { display: none; height: 100vh; }
        #view-feed { display: block; }
        #feed-container { flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; background: #000; }
        .video-slide { height: 100vh; scroll-snap-align: start; position: relative; background: #111; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        
        .social-stack { position: absolute; right: 4vw; bottom: 12vh; display: flex; flex-direction: column; gap: 3vh; z-index: 10; }
        .stack-item { cursor: pointer; font-size: 8vw; text-align: center; }
        .stack-text { font-size: 2.5vw; display: block; margin-top: 2px; }

        #dl-panel { position: absolute; bottom: 8vh; left: 0; width: 100%; height: 0; overflow: hidden; transition: height 0.3s; background: #1a0a2e; z-index: 20; border-top: 2px solid var(--primary); }
        #dl-panel.active { height: 75vh; }
        
        nav { height: 8vh; background: #000; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 100; position: absolute; bottom: 0; left: 0; width: 100%; }
        .nav-btn { cursor: pointer; font-size: 4vw; }
        .nav-btn.active { color: var(--primary); }
    </style>
</head>
<body>

<div id="app">
    <div id="view-feed">
        <div id="feed-container">
            <!-- Videos will load here automatically -->
        </div>
        <div class="social-stack">
            <div class="stack-item" onclick="alert('Liked')">❤️<span class="stack-text">Like</span></div>
            <div class="stack-item" onclick="alert('Comment')">💬<span class="stack-text">Comment</span></div>
            <div class="stack-item" onclick="handleShare()">➤<span class="stack-text">Share</span></div>
            <div class="stack-item" onclick="showProfile()">👤<span class="stack-text">Me</span></div>
        </div>
    </div>

    <div id="view-upload"><div style="padding: 20vw; text-align: center;"><h1>＋ Gallery Upload</h1></div></div>
    <div id="view-profile"><div style="padding: 20vw; text-align: center;"><h2>X10 Profile</h2></div></div>
    <div id="dl-panel"><div style="padding: 2vh;"><h3>Downloads</h3><h3 onclick="toggleDownloads()">×</h3></div></div>

    <nav>
        <div class="nav-btn" onclick="showFeed()">Feed</div>
        <div class="nav-btn" onclick="showUpload()">＋</div>
        <div class="nav-btn" onclick="toggleDownloads()">DL</div>
        <div class="nav-btn" onclick="showProfile()">Account</div>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
    const CURRENT_APP_VERSION = 4;

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // The Automatic Data Loop
    async function initFeed() {
        const { data, error } = await supabase.from('videos').select('*');
        if (error) {
            console.error("Connection Error:", error);
        } else {
            const feed = document.getElementById('feed-container');
            data.forEach(video => {
                const div = document.createElement('div');
                div.className = 'video-slide';
                div.innerHTML = `<video src="${video.url}" width="100%" height="100%" autoplay loop playsinline muted></video>`;
                feed.appendChild(div);
            });
        }
    }

    function showFeed() { document.getElementById('view-feed').style.display='block'; document.getElementById('view-profile').style.display='none'; document.getElementById('view-upload').style.display='none'; }
    function showProfile() { document.getElementById('view-feed').style.display='none'; document.getElementById('view-profile').style.display='block'; document.getElementById('view-upload').style.display='none'; }
    function showUpload() { document.getElementById('view-feed').style.display='none'; document.getElementById('view-profile').style.display='none'; document.getElementById('view-upload').style.display='block'; }
    function toggleDownloads() { document.getElementById('dl-panel').classList.toggle('active'); }
    function handleShare() { alert("Opening Share/Chat..."); }

    window.onload = () => {
        initFeed(); // Starts the video loop
        if ((localStorage.getItem('ver') || 1) < CURRENT_APP_VERSION) alert("Update needed!");
    };
</script>
</body>
</html>
