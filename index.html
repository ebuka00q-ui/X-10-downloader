<body>

<div class="search-container" style="padding: 10px;">
    <input type="text" id="searchInput" placeholder="Search for movies..." oninput="handleSearch()">
</div>

<nav style="display: flex; gap: 10px; padding: 10px;">
    <button onclick="showView('view-home')">Home</button>
    <button onclick="showView('view-movie')">Movie</button>
    <button onclick="showView('view-live')">Live</button>
    <button onclick="showView('view-download')">Download</button>
</nav>

<div id="view-home" class="view" style="display:block;"><h1>Home</h1><div id="results"></div></div>
<div id="view-movie" class="view" style="display:none;"><h1>Movies</h1></div>
<div id="view-live" class="view" style="display:none;"><h1>Live Stream</h1></div>
<div id="view-download" class="view" style="display:none;"><h1>Downloads</h1></div>

<script>
    // Navigation logic
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(view => view.style.display = 'none');
        document.getElementById(viewId).style.display = 'block';
    }

    // Search logic
    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = query.length > 2 ? 
            `<div style="padding: 10px; border: 1px solid #ccc; margin-top: 10px;">
                <p>Found: ${query}</p>
                <button onclick="alert('Link not connected yet!')">Play Movie</button>
            </div>` : '';
    }

    // Your Update logic
    function checkForUpdates() {
        // [YOUR EXISTING UPDATE CODE GOES INSIDE HERE]
        console.log("Update check running...");
    }

    // Combined initialization
    window.onload = function() {
        showView('view-home'); // Set default view
        checkForUpdates();     // Run your update function
    };
</script>

</body>
