<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 DOWNLOADER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body class="bg-black text-white min-h-screen pb-20">

    <header class="p-4 border-b border-gray-800">
        <h1 class="text-xl font-bold text-indigo-500">X10 DOWNLOADER</h1>
    </header>

    <main id="app-main" class="p-4">
        
        <div id="page-home" class="page active">
            <div class="flex gap-2 mb-4">
                <button onclick="renderList('fyp')" class="bg-indigo-900 px-4 py-1 rounded text-xs">For You</button>
                <button onclick="renderList('movies')" class="bg-gray-800 px-4 py-1 rounded text-xs">Movies</button>
            </div>
            <div id="list-home" class="space-y-3"></div>
        </div>

        <div id="page-live" class="page">
            <h2 class="text-emerald-400 text-xs mb-2 uppercase">Live Relays</h2>
            <div id="list-live" class="space-y-3"></div>
        </div>

        <div id="page-downloads" class="page">
            <h2 class="text-indigo-400 text-xs mb-2 uppercase">My Library</h2>
            <div class="bg-gray-900 p-4 rounded-lg mb-4">
                <h3 class="text-[10px] text-gray-400 uppercase">Downloaded</h3>
                <div id="list-dwn" class="mt-2 space-y-2"></div>
            </div>
            <div class="bg-gray-900 p-4 rounded-lg">
                <h3 class="text-[10px] text-gray-400 uppercase">Pinned</h3>
                <div id="list-pin" class="mt-2 space-y-2"></div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-black border-t border-gray-800 p-4 flex justify-around text-xs font-bold">
        <button onclick="switchTab('home')">HOME</button>
        <button onclick="switchTab('live')">LIVE</button>
        <button onclick="switchTab('downloads')">DOWNLOADS</button>
    </nav>

    <script>
        function switchTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
        }

        function renderList(type) {
            const container = document.getElementById('list-home');
            container.innerHTML = '<p class="text-[10px] text-gray-500">Loading ' + type + '...</p>';
        }

        // Initial setup for the Download/Pin section
        function loadStorage() {
            // Logic to fetch from LocalStorage for Pinned and Downloaded items
            document.getElementById('list-dwn').innerHTML = '<p class="text-xs">No downloads yet.</p>';
            document.getElementById('list-pin').innerHTML = '<p class="text-xs">No pins yet.</p>';
        }

        loadStorage();
    </script>
</body>
</html>
