<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 DOWNLOADER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(-45deg, #0b0813, #1a0b2e, #0d1b3e, #14051c); 
            background-size: 400% 400%; 
            animation: L 8s infinite; 
            color: #fff; font-family: sans-serif; 
        }
        @keyframes L { 0%, 100% { background-position: 0% 50% } 50% { background-position: 100% 50% } }
        .P { display: none; } .P.active { display: block; }
        .F { scroll-snap-type: y mandatory; overflow-y: scroll; height: calc(100vh - 240px); scrollbar-width: none; }
        .F::-webkit-scrollbar { display: none; }
        .C { scroll-snap-align: start; height: 100%; position: relative; }
        button:active { transform: scale(0.95); transition: transform 0.1s; }
        .active-nav { color: #6366f1 !important; border-bottom: 2px solid #6366f1; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20 select-none">

    <div id="search-overlay" class="hidden fixed inset-0 bg-[#0b0813]/95 backdrop-blur-md z-[100] p-4 flex flex-col">
        <div class="max-w-md mx-auto w-full space-y-4 pt-10">
            <div class="flex justify-between items-center">
                <h2 id="search-title" class="text-xs font-bold text-indigo-400 uppercase">Search Engine</h2>
                <button id="btn-close-search" class="text-xs text-red-400 bg-red-950/40 px-2 py-1 rounded">✕ Close</button>
            </div>
            <div class="flex gap-2">
                <input id="overlay-search-input" type="text" placeholder="Search..." class="flex-1 bg-[#130f22] border border-gray-700 rounded p-2 text-xs text-white">
                <button id="btn-submit-search" class="bg-indigo-600 px-3 rounded text-xs font-bold">Search</button>
            </div>
            <div id="search-results-viewport" class="space-y-2 overflow-y-auto max-h-[60vh]"></div>
        </div>
    </div>

    <main class="flex-1 max-w-md mx-auto w-full p-4 space-y-4">
        <div id="page-home" class="P active space-y-4">
            <div class="flex justify-between items-center bg-[#130f22]/60 border border-white/5 p-4 rounded-2xl shadow-xl">
                <h1 class="text-sm font-black text-indigo-400">X10 DOWNLOADER</h1>
                <button id="btn-trigger-search" class="bg-indigo-500/10 text-xs px-3 py-1.5 rounded-xl text-indigo-400">🔍</button>
            </div>
            <div class="flex text-center text-xs font-bold border-b border-white/5">
                <button id="btn-sub-foryou" class="flex-1 pb-2 border-b-2 border-indigo-500 text-white">FYP</button>
                <button id="btn-sub-movies" class="flex-1 pb-2 border-b-2 border-transparent text-gray-400">MOVIES</button>
            </div>
            <div id="sub-foryou" class="S active"><div class="F border border-white/5 rounded-2xl bg-black overflow-hidden"></div></div>
            <div id="sub-movies" class="S hidden"><div class="grid grid-cols-2 gap-3"></div></div>
        </div>

        <div id="page-workspace" class="P space-y-4">
            <div class="aspect-video bg-black rounded-2xl overflow-hidden"><video id="workspace-video-player" controls playsinline class="w-full h-full"></video></div>
            <h2 id="workspace-preview-title" class="text-xs font-bold text-gray-300"></h2>
            <div class="grid grid-cols-2 gap-3"><button id="btn-watch-now" class="bg-indigo-600 py-2 rounded-xl text-xs">WATCH</button><button id="btn-download-now" class="bg-emerald-600 py-2 rounded-xl text-xs">DOWNLOAD</button></div>
        </div>

        <div id="page-live" class="P space-y-4">
            <h1 class="text-xs font-bold text-emerald-400">LIVE SPORTS</h1>
            <video id="live-video-player" controls playsinline class="w-full aspect-video bg-black rounded-2xl"></video>
            <div id="live-feed-directory-scroller" class="space-y-2"></div>
        </div>

        <div id="page-downloads" class="P space-y-3">
            <h1 class="text-xs font-bold text-gray-300">LIBRARY</h1>
            <div id="downloads-list" class="grid grid-cols-1 gap-2"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 bg-[#0d091a]/95 backdrop-blur-md border-t border-white/5 py-3 flex justify-around z-40">
        <button id="nav-home" class="active-nav text-sm">Home</button>
        <button id="nav-live" class="text-gray-400 text-sm">Live</button>
        <button id="nav-downloads" class="text-gray-400 text-sm">Library</button>
    </nav>

    <script>
        const key = '5dcf7f28a88be0edc01bbbde06f024ab';
        
        // Touch Interaction Helper
        const bindTouch = (id, fn) => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener('click', fn);
                el.addEventListener('touchstart', fn, {passive: false});
            }
        };

        window.switchTab = function(t) {
            document.querySelectorAll('.P').forEach(p => p.classList.remove('active'));
            document.getElementById('page-'+t).classList.add('active');
            ['home','live','downloads'].forEach(b => {
                document.getElementById('nav-'+b).className = (t===b ? 'active-nav text-sm' : 'text-gray-400 text-sm');
            });
        };

        bindTouch('nav-home', () => switchTab('home'));
        bindTouch('nav-live', () => switchTab('live'));
        bindTouch('nav-downloads', () => switchTab('downloads'));
        bindTouch('btn-trigger-search', () => { document.getElementById('search-overlay').classList.remove('hidden'); });
        bindTouch('btn-close-search', () => { document.getElementById('search-overlay').classList.add('hidden'); });
        
        // Feed Initialization
        const fypFeeds = [{src:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'}];
        const feed = document.querySelector('.F');
        fypFeeds.forEach(f => {
            let i = document.createElement('div');
            i.className = 'C';
            i.innerHTML = `<video class="w-full h-full object-cover" loop playsinline autoplay muted src="${f.src}"></video>`;
            feed.appendChild(i);
        });
    </script>
</body>
</html>
