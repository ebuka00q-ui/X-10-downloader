<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>X10 Downloader</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#00ff88">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loader">

<div class="logo">

<img src="https://i.imgur.com/8Km9tLL.png">

<h1>X10 Downloader</h1>

<p>Loading Football...</p>

</div>

</div>

<div id="app">

<header>

<div class="top">

<div>

<h2>X10 Downloader</h2>

<p id="todayDate"></p>

</div>

<button id="notificationBtn">

🔔

<span id="notifyCount">0</span>

</button>

</div>

<div class="search">

<input

type="text"

id="search"

placeholder="Search club or league...">

</div>

</header>

<main id="pages">

<section id="homePage" class="page active">

<h3>Today's Matches</h3>

<div id="todayMatches"></div>

</section>

<section id="sportsPage" class="page">

<h3>Competitions</h3>

<div id="leagueList"></div>

</section>

<section id="favoritePage" class="page">

<div class="pageTitle">

<h3>Favorites</h3>

</div>

<div id="favoriteList"></div>

</section>

<section id="watchPage" class="page">

<h3>Watch</h3>

<input

id="videoLink"

placeholder="Paste video link...">

<button id="watchButton">

Watch

</button>

<div id="player"></div>

</section>

<section id="profilePage" class="page">

<div class="profile">

<div id="avatar">

👤

</div>

<h2 id="username">

Creator

</h2>

<p id="userid">

@creator

</p>

<button id="editProfile">

Edit Profile

</button>

</div>

</section>

</main>

<nav>

<button class="nav active"

data-page="homePage">

🏠

<span>Home</span>

</button>

<button class="nav"

data-page="sportsPage">

⚽

<span>Sports</span>

</button>

<button class="nav"

data-page="favoritePage">

⭐

<span>Favorites</span>

</button>

<button class="nav"

data-page="watchPage">

▶️

<span>Watch</span>

</button>

<button class="nav"

data-page="profilePage">

👤

<span>Profile</span>

</button>

</nav>

</div>

<script src="app.js"></script>

</body>

</html>
