<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X10 Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Mobile-First Adaptive CSS */
        :root { --primary: #FF00FF; --bg: #000; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: sans-serif; height: 100%; width: 100%; overflow: hidden; }
        
        #app { display: flex; flex-direction: column; height: 100%; width: 100%; }
        
        /* Scalable Search Container */
        .search-container { padding: 3%; background: #000; flex-shrink: 0; }
        .search-box { width: 100%; padding: 4% 5%; border: 1px solid var(--primary); background: #111; color: #fff; border-radius: 12px; font-size: 1rem; }
        
        /* Scalable Content Panels */
        .content { flex: 1; overflow-y: auto; padding: 5%; }
        .panel { display: none; }
        .panel.active { display: block; }
        
        /* Scalable Navigation Bar */
        .nav-bar { display: flex; justify-content: space-around; padding: 4% 2%; border-top: 1px solid var(--primary); background: #000; flex-shrink: 0; }
        .nav-btn { color: #fff; background: none; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .nav-btn.active { color: var(--primary); }
    </style>
</head>
<body>

<div id="app">
    <div class="search-container">
        <input type="text" class="search-box" placeholder="Search movies or creators...">
    </div>
    
    <div class="content">
        <div id="HOME" class="panel active"><h2>For You</h2><p>Swipe to browse...</p></div>
        <div id="LIVE" class="panel"><h2>Live Match</h2><p>Spain Broadcast: Active.</p></div>
        <div id="DOWNLOAD" class="panel"><h2>My Downloads</h2><p>Empty.</p></div>
        <div id="ACCOUNT" class="panel"><h2>Profile</h2><div id="follower-display" style="color: var(--primary); font-size: 1.5rem;">100,000,000 Followers</div></div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="switchPanel('HOME', this)">Home</button>
        <button class="nav-btn" onclick="switchPanel('LIVE', this)">Live</button>
        <button class="nav-btn" onclick="switchPanel('DOWNLOAD', this)">Download</button>
        <button class="nav-btn" onclick="switchPanel('ACCOUNT', this)">Account</button>
    </nav>
</div>

<script>
    // Supabase Setup
    const supabase = supabase.createClient("https://gkfivuvtpfetzatz.supabase.co", "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE");
    
    // Panel Switching Logic
    function switchPanel(id, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }
</script>
</body>
</html>
