<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0a0a0f;
    font-family: 'Segoe UI', Arial, sans-serif;
}

.icon-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.icon-container {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #1a0a2e, #0d0520);
    box-shadow: 
        0 0 40px rgba(255, 0, 200, 0.4),
        0 0 80px rgba(255, 0, 200, 0.2),
        inset 0 0 60px rgba(255, 0, 200, 0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    border: 3px solid rgba(255, 0, 200, 0.3);
}

/* Signal Waves (3 arcs above) */
.signal-waves {
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0px;
}

.arc {
    border: 3px solid #ff00cc;
    border-radius: 50%;
    width: 50px;
    height: 22px;
    border-bottom: none;
    opacity: 0.8;
    box-shadow: 0 0 15px rgba(255, 0, 200, 0.5);
}

.arc1 { width: 34px; height: 14px; border-color: #ff44dd; }
.arc2 { width: 50px; height: 20px; border-color: #ff22cc; }
.arc3 { width: 66px; height: 26px; border-color: #ff00bb; }

/* X10 Text */
.x10-text {
    font-size: 110px;
    font-weight: 900;
    letter-spacing: -4px;
    background: linear-gradient(to bottom, #ff88ee, #ff44cc, #cc00aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 
        0 0 30px rgba(255, 0, 200, 0.5),
        0 0 60px rgba(255, 0, 200, 0.3);
    position: relative;
    top: 18px;
    font-family: 'Segoe UI', Arial, sans-serif;
}

/* Antenna tower (stylized '1') */
.antenna {
    display: inline-block;
    position: relative;
    font-size: 110px;
    font-weight: 900;
    background: linear-gradient(to bottom, #ff88ee, #ff44cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Small dot at bottom of X10 */
.dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    background: #ff44cc;
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255, 0, 200, 0.8);
    margin-left: 2px;
    position: relative;
    top: -25px;
}

/* App name below */
.app-name {
    color: #cc88dd;
    font-size: 18px;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(255, 0, 200, 0.3);
    font-weight: 300;
    margin-top: 8px;
}

/* Label */
.label {
    color: #666;
    font-size: 14px;
    letter-spacing: 2px;
    margin-top: 10px;
}
</style>
</head>
<body>
<div class="icon-wrapper">
    <div class="icon-container">
        <!-- Signal Waves -->
        <div class="signal-waves">
            <div class="arc arc1"></div>
            <div class="arc arc2"></div>
            <div class="arc arc3"></div>
        </div>
        
        <!-- X10 Text with Antenna -->
        <div class="x10-text">
            X<span class="antenna">1</span>0
            <span class="dot"></span>
        </div>
    </div>
    <div class="app-name">X10 Downloader</div>
    <div class="label">▼ NEON ICON ▼</div>
</div>
</body>
</html>
