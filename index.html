<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 DOWNLOADER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #fff; overflow-x: hidden; }
        .page { display: none; height: 100vh; width: 100vw; position: relative; }
        .page.active { display: block; }
        /* Smooth vertical feed without 'chunking' */
        .feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .video-slide { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="page-home" class="page active">
        <div id="feed" class="feed">
            </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-black/80 p-4 flex justify-around z-50 border-t border-white/10">
        <button onclick="window.location.reload()" class="text-xs font-bold">HOME</button>
        <button onclick="alert('Live Stream Integration Ready')" class="text-xs font-bold">LIVE</button>
        <button onclick="alert('Storage Ready')" class="text-xs font-bold">LIBRARY</button>
    </nav>

    <script>
        const videos = [
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'
        ];

        const feed = document.getElementById('feed');
        videos.forEach(src => {
            let s = document.createElement('div');
            s.className = 'video-slide';
            s.innerHTML = `<video src="${src}" playsinline loop autoplay muted></video>
                           <button onclick="alert('Download started!')" class="absolute bottom-20 right-4 bg-emerald-600 p-4 rounded-full text-white">📥</button>`;
            feed.appendChild(s);
        });
    </script>
</body>
</html>
