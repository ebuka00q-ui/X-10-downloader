<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 DOWNLOADER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .page { display: none; }
        .page.active { display: block; }
        .sub-tab { display: none; }
        .sub-tab.active { display: block; }
    </style>
</head>
<body class="bg-[#0b0813] text-white min-h-screen pb-20">

    <div id="search-zone" class="p-4 bg-[#130f22] border-b border-white/10">
        <div class="flex gap-2">
            <input id="search-input" type="text" placeholder="Search..." class="flex-1 bg-black p-2 rounded text-xs border border-white/10">
            <button onclick="runSearch()" class="bg-indigo-600 px-4 rounded text-xs font-bold">GO</button>
        </div>
    </div>

    <main class="p-4">
        <div id="page-home" class="page active">
            <div class="flex gap-4 mb-4 border-b border-white/10 pb-2">
                <button onclick="switchSub('fyp')" class="text-xs font-bold text-indigo-400">FYP</button>
                <button onclick="switchSub('movies')" class="text-xs font-bold text-gray-400">MOVIES</button>
            </div>
            <video id="main-video" class="w-full aspect-video bg-black rounded-lg" controls playsinline></video>
            <div id="fyp-list" class="sub-tab active mt-4 space-y-2"></div>
            <div id="movies-list" class="sub-tab mt-4 space-y-2"></div>
        </div>

        <div id="page-live" class="page">
            <h2 class="text-emerald-400 text-xs font-bold mb-4">LIVE RELAYS</h2>
            <div id="live-list" class="space-y-3"></div>
        </div>

        <div id="page-downloads" class="page">
            <h2 class="text-indigo-400 text-xs font-bold mb-4">MY LIBRARY</h2>
            <div class="mb-6"><p class="text-[10px] text-gray-500 mb-2">DOWNLOADED</p><div id="dwn-list" class="space-y-2"></div></div>
            <div><p class="text-[10px] text-gray-500 mb-2">PINNED</p><div id="pin-list" class="space-y-2"></div></div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-black p-4 flex justify-around text-[10px] font-bold border-t border-white/5">
        <button onclick="nav('home')">HOME</button>
        <button onclick="nav('live')">LIVE</button>
        <button onclick="nav('downloads')">DOWNLOADS</button>
    </nav>

    <script>
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('search-zone').style.display = (id === 'downloads') ? 'none' : 'block';
        }

        function switchSub(id) {
            document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id + '-list').classList.add('active');
        }

        function runSearch() {
            let q = document.getElementById('search-input').value;
            if(!q) return;
            alert("Searching: " + q);
            document.getElementById('search-input').value = '';
        }

        // Logic for lists and video play
        const videos = [
            {t:'Big Buck Bunny',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'},
            {t:'Sintel',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'}
        ];

        videos.forEach(v => {
            let b = document.createElement('div');
            b.className = 'p-3 bg-[#130f22] rounded flex justify-between items-center text-xs';
            b.innerHTML = `${v.t} <button onclick="document.getElementById('main-video').src='${v.s}'; document.getElementById('main-video').play();" class="bg-indigo-600 px-2 py-1 rounded">▶</button>`;
            document.getElementById('fyp-list').appendChild(b);
        });
    </script>
</body>
</html>
