<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Global Ecosystem</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-pink: #ff00ff; --bg-black: #000000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-black); color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
        
        .panel { display: none; height: 100vh; padding: 110px 15px 70px 15px; overflow-y: auto; }
        .panel.active { display: block !important; }
        
        #top-bar { position: fixed; top: 0; width: 100%; height: 60px; background: #000; display: flex; align-items: center; padding: 10px; z-index: 1000; }
        #nav-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 1px solid #333; }
        
        .sub-nav { position: fixed; top: 60px; width: 100%; display: flex; justify-content: center; gap: 20px; background: #000; padding: 10px; z-index: 999; }
        .tab-btn { background: none; border: none; color: #888; font-weight: bold; cursor: pointer; padding: 5px; }
        .tab-btn.active { color: var(--neon-pink); border-bottom: 2px solid var(--neon-pink); }
        
        .content { display: none; }
        .content.active { display: block; }
    </style>
</head>
<body>

    <div id="top-bar">
        <input type="text" id="main-search" placeholder="Search..." style="flex:1; padding:10px; background:#222; color:white; border:none; border-radius:5px;">
        <button onclick="executeScopedSearch()" style="background:var(--neon-pink); border:none; padding:10px; color:white; border-radius:5px;">GO</button>
    </div>

    <div id="home-panel" class="panel active">
        <div class="sub-nav">
            <button class="tab-btn active" onclick="showSub(this, 'fy')">For You</button>
            <button class="tab-btn" onclick="showSub(this, 'movies')">Movies</button>
        </div>
        <div id="fy" class="content active"><h1>For You Feed</h1></div>
        <div id="movies" class="content"><h1>Movie Catalog</h1></div>
    </div>

    <div id="live-panel" class="panel">
        <div class="sub-nav">
            <button class="tab-btn active" onclick="showSub(this, 'active-live')">Active</button>
            <button class="tab-btn" onclick="showSub(this, 'prev-live')">Previous</button>
        </div>
        <div id="active-live" class="content active"><h1>Active Live Matches</h1></div>
        <div id="prev-live" class="content"><h1>Previous 7 Days</h1></div>
    </div>

    <div id="download-panel" class="panel"><h1>Downloads</h1></div>
    <div id="account-panel" class="panel"><h1>Account</h1></div>

    <div id="nav-bar">
        <button class="nav-btn active" onclick="switchPanel('home-panel', this)">Home</button>
        <button class="nav-btn" onclick="switchPanel('live-panel', this)">Live</button>
        <button class="nav-btn" onclick="switchPanel('download-panel', this)">Download</button>
        <button class="nav-btn" onclick="switchPanel('account-panel', this)">Account</button>
    </div>

    <script>
        // GLOBAL SUPABASE ACCESS
        const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
        window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CONTEXT-AWARE SEARCH
        function executeScopedSearch() {
            const query = document.getElementById('main-search').value;
            const activePanel = document.querySelector('.panel.active').id;
            const activeSub = document.querySelector('.panel.active .content.active').id;
            
            console.log(`Searching for "${query}" within: ${activePanel} -> ${activeSub}`);
            // Logic: This will trigger the Supabase filter for the specific category
            alert(`Searching ${activeSub} for: ${query}`);
        }

        // NAVIGATION & AUTO-PAUSE LOGIC
        function switchPanel(id, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');

            const showTop = (id === 'home-panel' || id === 'live-panel');
            document.getElementById('top-bar').style.display = (id === 'download-panel') ? 'none' : 'flex';
            document.querySelector('.sub-nav').style.display = showTop ? 'flex' : 'none';
        }

        function showSub(btn, contentId) {
            const parent = btn.closest('.panel');
            parent.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(contentId).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
