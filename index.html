<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X10 Downloader</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #000000; color: #ffffff; touch-action: manipulation; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; height: 100%; transition: all 0.2s; }
    .active-tab { color: #ffffff; font-weight: 700; border-top: 2px solid #ffffff; }
    .inactive-tab { color: #666666; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    // Backend Connection
    const supabase = createClient("https://gkfivuvtpfetzatz.supabase.co", "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE");

    const X10App = () => {
      const [currentTab, setCurrentTab] = useState('home');
      const [showExitModal, setShowExitModal] = useState(false);
      const [isCreator] = useState(true);

      // Back Button Protocol
      useEffect(() => {
        const handlePopState = () => setShowExitModal(true);
        window.history.pushState(null, null, window.location.pathname);
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      return (
        <div className="flex flex-col h-screen w-full">
          {/* Main Content Viewport */}
          <main className="flex-1 overflow-y-auto p-4">
            {currentTab === 'home' && <div className="text-xl font-bold">Home/FYP Content</div>}
            {currentTab === 'live' && <div className="text-xl font-bold">Live Content</div>}
            {currentTab === 'downloads' && <div className="text-xl font-bold">Downloads</div>}
            {currentTab === 'account' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h1 className="text-2xl font-bold">Profile</h1>
                  {isCreator && <button className="p-2 border border-gray-700 rounded-lg">Settings</button>}
                </div>
                <div className="text-3xl font-black text-blue-500">100,000,000+ Followers</div>
              </div>
            )}
          </main>

          {/* Navigation Bar - Fixed to bottom */}
          <nav className="h-20 w-full bg-black border-t border-gray-800 flex shrink-0">
            {['home', 'live', 'downloads', 'account'].map((tab) => (
              <button 
                key={tab} 
                onClick={() => setCurrentTab(tab)} 
                className={`nav-btn uppercase text-[10px] tracking-widest ${currentTab === tab ? 'active-tab' : 'inactive-tab'}`}
              >
                {tab}
              </button>
            ))}
          </nav>

          {/* Exit Modal - Confirmation overlay */}
          {showExitModal && (
            <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-50">
              <div className="bg-[#1a1a1a] p-8 rounded-3xl w-4/5 max-w-sm text-center border border-gray-800">
                <h2 className="text-xl font-bold mb-6">Exit Application?</h2>
                <div className="flex gap-4">
                  <button onClick={() => window.close()} className="flex-1 bg-red-600 py-3 rounded-full font-bold">EXIT</button>
                  <button onClick={() => setShowExitModal(false)} className="flex-1 bg-gray-700 py-3 rounded-full font-bold">CANCEL</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<X10App />);
  </script>
</body>
</html>
