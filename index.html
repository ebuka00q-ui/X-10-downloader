<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #FF00FF; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Search Bar */
        .search-area { padding: 15px; flex-shrink: 0; }
        #search-input { width: 100%; padding: 12px; border: 1px solid var(--accent); background: #111; color: #fff; border-radius: 8px; }
        
        /* Category Toggle */
        .tabs { display: flex; gap: 20px; padding: 10px 15px; font-weight: bold; color: #888; }
        .tabs .active { color: #fff; border-bottom: 2px solid var(--accent); }

        /* Panels */
        #main-content { flex: 1; overflow-y: auto; padding: 15px; }
        .panel { display: none; }
        .panel.active { display: block; }
        
        /* Navigation */
        .nav-bar { display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #333; background: #000; flex-shrink: 0; }
        .nav-btn { color: #888; background: none; border: none; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: var(--accent); }
    </style>
</head>
<body>

<div id="main-content">
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Search movies or creators...">
    </div>
    
    <div class="tabs">
        <span class="active" onclick="toggleSub(this)">For You</span>
        <span onclick="toggleSub(this)">Movies</span>
    </div>

    <div id="HOME" class="panel active"><h3>Home Feed</h3><p>Content loading...</p></div>
    <div id="LIVE" class="panel"><h3>Live Match</h3><p>Spain vs. Opponent</p></div>
    <div id="DOWNLOAD" class="panel"><h3>Downloads</h3><p>No files.</p></div>
    <div id="ACCOUNT" class="panel"><h3>Profile</h3><div id="follower-display">100,000,000 Followers</div></div>
</div>

<nav class="nav-bar">
    <button class="nav-btn active" onclick="switchPanel('HOME', this)">HOME</button>
    <button class="nav-btn" onclick="switchPanel('LIVE', this)">LIVE</button>
    <button class="nav-btn" onclick="switchPanel('DOWNLOAD', this)">DOWNLOAD</button>
    <button class="nav-btn" onclick="switchPanel('ACCOUNT', this)">ACCOUNT</button>
</nav>

<script>
    const supabase = supabase.createClient("https://gkfivuvtpfetzatz.supabase.co", "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE");
    
    // Panel Switching
    function switchPanel(id, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    // Sub-toggle (For You / Movies)
    function toggleSub(el) {
        document.querySelectorAll('.tabs span').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
