<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Global Configuration
  const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
  const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Unified Panel Switching Engine
  function switchPanel(id, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  // Monetization & Ad Logic
  async function checkUserAccess(userId) {
    const { data } = await supabase.from('profiles').select('is_subscribed').eq('id', userId).single();
    
    if (data?.is_subscribed) {
      // Premium: No ads, Full access enabled
      document.getElementById('ad-container').style.display = 'none';
      enablePremiumFeatures();
    } else {
      // Free User: Show ads, restrict 4K/Archive
      document.getElementById('ad-container').style.display = 'block';
      restrictPremiumFeatures();
    }
  }
</script>
