<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X10 Downloader</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const X10App = () => {
      const [currentTab, setCurrentTab] = useState('home');
      const [showExitModal, setShowExitModal] = useState(false);
      const [isCreator] = useState(true);

      // Back Button Protocol
      useEffect(() => {
        const handlePopState = () => {
          setShowExitModal(true);
        };
        window.history.pushState(null, null, window.location.pathname);
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      return (
        <div className="w-full h-screen flex flex-col bg-black text-white">
          {/* Main Content Area */}
          <main className="flex-1 overflow-y-auto p-4">
            {currentTab === 'home' && <div><h1 className="text-2xl font-bold">Home/FYP Content</h1></div>}
            {currentTab === 'live' && <div><h1 className="text-2xl font-bold">Live Content</h1></div>}
            {currentTab === 'downloads' && <div><h1 className="text-2xl font-bold">Downloads</h1></div>}
            {currentTab === 'account' && (
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h1 className="text-2xl font-bold">Profile</h1>
                </div>
                <div className="text-3xl font-bold mt-4">{isCreator ? "100,000,000+ Followers" : "Followers"}</div>
              </div>
            )}
          </main>

          {/* Persistent Navigation Bar - This was missing! */}
          <nav className="flex justify-around items-center py-4 border-t border-gray-800 bg-black">
            <button onClick={() => setCurrentTab('home')} className={currentTab === 'home' ? 'text-white' : 'text-gray-500'}>Home</button>
            <button onClick={() => setCurrentTab('live')} className={currentTab === 'live' ? 'text-white' : 'text-gray-500'}>Live</button>
            <button onClick={() => setCurrentTab('downloads')} className={currentTab === 'downloads' ? 'text-white' : 'text-gray-500'}>Downloads</button>
            <button onClick={() => setCurrentTab('account')} className={currentTab === 'account' ? 'text-white' : 'text-gray-500'}>Account</button>
          </nav>

          {/* Exit Modal */}
          {showExitModal && (
            <div className="fixed inset-0 flex items-center justify-center bg-black/90 z-50">
              <div className="bg-gray-900 p-6 rounded-lg text-center">
                <p className="mb-6">Do you want to exit the app?</p>
                <div className="flex gap-4">
                  <button onClick={() => window.close()} className="bg-red-600 px-6 py-2 rounded">Exit</button>
                  <button onClick={() => setShowExitModal(false)} className="bg-gray-700 px-6 py-2 rounded">Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<X10App />);
  </script>
</body>
</html>
