<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10</title><script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:linear-gradient(-45deg,#0b0813,#1a0b2e,#0d1b3e,#14051c);background-size:400% 400%;animation:L 8s infinite;color:#fff;font-family:sans-serif}
        @keyframes L{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
        .P{display:none}.P.active{display:block}
        .S{display:none}.S.active{display:block}
        .movie-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:10px;}
        .cube-img{aspect-ratio:1/1; width:100%; object-fit:cover; border-radius:10px; background:#000;}
        .nav-btn.active-tab{color:#818cf8; border-bottom:2px solid #818cf8;}
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20">

    <div id="search-overlay" class="hidden fixed inset-0 bg-[#0b0813]/95 z-50 p-4">
        <div class="max-w-md mx-auto pt-10 space-y-4">
            <h2 class="text-xs font-bold text-indigo-400">SEARCH MOVIES</h2>
            <div class="flex gap-2">
                <input id="search-input" type="text" class="flex-1 bg-[#130f22] p-2 rounded text-xs text-white" placeholder="Type movie name...">
                <button onclick="document.getElementById('search-overlay').classList.add('hidden')" class="bg-red-900/50 px-4 rounded text-xs">Cancel</button>
            </div>
            <div id="search-results" class="text-xs text-gray-400">Type to search...</div>
        </div>
    </div>

    <main class="flex-1 max-w-md mx-auto w-full p-4 space-y-4">
        <div id="page-home" class="P active">
            <div class="flex justify-between items-center bg-[#130f22]/60 p-4 rounded-2xl mb-4">
                <h1 class="text-sm font-black text-indigo-400">X10 DOWNLOADER</h1>
                <button onclick="document.getElementById('search-overlay').classList.remove('hidden')" class="bg-indigo-500/20 text-xs px-3 py-1 rounded-xl text-indigo-400">🔍 Search</button>
            </div>
            <div class="flex text-center text-xs font-bold border-b border-white/5 mb-4">
                <button id="btn-sub-foryou" class="flex-1 pb-2 border-b-2 border-indigo-500 text-white">For You</button>
                <button id="btn-sub-movies" class="flex-1 pb-2 border-b-2 border-transparent text-gray-400">Movies</button>
            </div>
            <div id="sub-foryou" class="S active"><p class="text-center text-gray-500 py-10">Add your video links in the code to see them here.</p></div>
            <div id="sub-movies" class="S"><div class="movie-grid" id="movie-gallery"></div></div>
        </div>

        <div id="page-live" class="P text-center py-20">LIVE SPORTS HUB</div>

        <div id="page-downloads" class="P text-center py-20">OFFLINE STORAGE</div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 bg-[#0d091a]/95 border-t border-white/5 py-3 flex justify-around z-40">
        <button onclick="switchTab('home', this)" class="nav-btn active-tab text-sm">Home</button>
        <button onclick="switchTab('live', this)" class="nav-btn text-gray-400 text-sm">Live</button>
        <button onclick="switchTab('downloads', this)" class="nav-btn text-gray-400 text-sm">Downloads</button>
    </nav>

    <script>
        // Tab Switcher
        function switchTab(t, btn) {
            document.querySelectorAll('.P').forEach(p => p.classList.remove('active'));
            document.getElementById('page-'+t).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
        }

        // Sub-Tab Switcher
        document.getElementById('btn-sub-movies').onclick = () => {
            document.getElementById('sub-foryou').classList.remove('active');
            document.getElementById('sub-movies').classList.add('active');
            renderMovies();
        };
        document.getElementById('btn-sub-foryou').onclick = () => {
            document.getElementById('sub-movies').classList.remove('active');
            document.getElementById('sub-foryou').classList.add('active');
        };

        function renderMovies(){
            const g = document.getElementById('movie-gallery');
            g.innerHTML = Array(6).fill(0).map(() => `
                <div class="text-center">
                    <div class="cube-img bg-indigo-900/30"></div>
                    <p class="text-[9px] mt-1 font-bold">Movie Title</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
