<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X10 Downloader</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    const X10App = () => {
      const [currentTab, setCurrentTab] = useState('home');
      const [showExitModal, setShowExitModal] = useState(false);

      return (
        <div className="flex flex-col h-screen w-full bg-black overflow-hidden">
          {/* Main Content: Takes all available space */}
          <main className="flex-1 overflow-y-auto p-4 w-full">
            {currentTab === 'home' && <h1 className="text-2xl font-bold">Home/FYP Content</h1>}
            {currentTab === 'live' && <h1 className="text-2xl font-bold">Live Content</h1>}
            {currentTab === 'downloads' && <h1 className="text-2xl font-bold">Downloads</h1>}
            {currentTab === 'account' && (
              <div>
                <h1 className="text-2xl font-bold">Profile</h1>
                <p className="text-3xl font-bold mt-4">100,000,000+ Followers</p>
              </div>
            )}
          </main>

          {/* Persistent Navigation: Fixed to bottom, visible on all screens */}
          <nav className="h-16 w-full flex justify-around items-center border-t border-gray-800 bg-black flex-shrink-0">
            <button onClick={() => setCurrentTab('home')} className={`text-sm ${currentTab === 'home' ? 'text-white font-bold' : 'text-gray-500'}`}>Home</button>
            <button onClick={() => setCurrentTab('live')} className={`text-sm ${currentTab === 'live' ? 'text-white font-bold' : 'text-gray-500'}`}>Live</button>
            <button onClick={() => setCurrentTab('downloads')} className={`text-sm ${currentTab === 'downloads' ? 'text-white font-bold' : 'text-gray-500'}`}>Downloads</button>
            <button onClick={() => setCurrentTab('account')} className={`text-sm ${currentTab === 'account' ? 'text-white font-bold' : 'text-gray-500'}`}>Account</button>
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<X10App />);
  </script>
</body>
</html>
