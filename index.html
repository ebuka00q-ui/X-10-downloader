<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>X10 Downloader</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0f;color:#fff;height:100vh;overflow:hidden;user-select:none}
#app{height:100vh;display:flex;flex-direction:column;background:#0a0a0f}
.hdr{padding:8px 14px 6px;background:#0a0a0f;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,0,200,0.2);flex-shrink:0;z-index:10}
.hdr-t{font-size:17px;font-weight:900;background:linear-gradient(135deg,#ff66dd,#cc00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-r{display:flex;align-items:center;gap:18px}
.hdr-s{font-size:20px;color:#ff44cc;cursor:pointer;background:0;border:0;padding:4px}
.stabs{display:flex;padding:6px 14px 0;gap:16px;background:#0a0a0f;border-bottom:1px solid rgba(255,0,200,0.1);flex-shrink:0;z-index:10}
.stab{padding:6px 2px 10px;font-size:12px;font-weight:600;color:#555;cursor:pointer;border-bottom:3px solid transparent;transition:all .3s;text-transform:uppercase;letter-spacing:.5px}
.stab.a{color:#ff44cc;border-bottom-color:#ff44cc;text-shadow:0 0 20px rgba(255,0,200,0.3)}
.cnt{flex:1;overflow:hidden;position:relative}
.pg{display:none;height:100%;overflow-y:auto;padding:10px;scroll-behavior:smooth}
.pg.a{display:block}
.vf{display:flex;flex-direction:column;gap:12px;padding-bottom:70px}
.vc{background:linear-gradient(145deg,#12121a,#0d0d15);border-radius:12px;overflow:hidden;border:1px solid rgba(255,0,200,0.15)}
.vp{width:100%;aspect-ratio:9/16;background:linear-gradient(145deg,#1a0a2e,#0d0520);display:flex;align-items:center;justify-content:center}
.vp .pi{font-size:36px;color:#ff44cc;opacity:.6}
.vi{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,0.5)}
.vu{font-weight:600;color:#ff66dd;font-size:12px}
.va{display:flex;gap:10px;align-items:center}
.va button{background:0;border:0;color:#888;font-size:15px;cursor:pointer;transition:all .2s;padding:2px}
.va button:hover{color:#ff44cc;transform:scale(1.1)}
.bnav{display:flex;justify-content:space-around;align-items:center;padding:6px 0 12px;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,0,200,0.15);flex-shrink:0;position:sticky;bottom:0;z-index:20}
.ni{display:flex;flex-direction:column;align-items:center;color:#555;font-size:9px;cursor:pointer;transition:all .3s;padding:2px 10px;border:0;background:0;font-family:inherit}
.ni .nic{font-size:18px;transition:all .3s}
.ni.a{color:#ff44cc}
.ni.a .nic{text-shadow:0 0 30px rgba(255,0,200,0.5)}
.lc{background:linear-gradient(145deg,#1a0a2e,#0d0520);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid rgba(255,0,200,0.1);display:flex;justify-content:space-between;align-items:center}
.lc .lt{color:#ff88ee;font-weight:600;font-size:13px}
.lc .ls{color:#ff4444;font-size:10px;font-weight:700;text-transform:uppercase}
.di{display:flex;gap:8px;margin-bottom:14px}
.di input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,0,200,0.2);background:#12121a;color:#fff;font-size:13px;outline:0}
.di input:focus{border-color:#ff44cc}
.di button{padding:10px 18px;border-radius:10px;border:0;background:linear-gradient(135deg,#ff44cc,#aa00cc);color:#fff;font-weight:700;cursor:pointer;transition:all .3s;font-size:13px}
.di button:hover{transform:scale(1.03)}
.ph{text-align:center;padding:14px 0}
.pa{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ff44cc,#aa00cc);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;border:3px solid rgba(255,0,200,0.3)}
.pn{font-size:17px;font-weight:700;color:#ff88ee}
.ps{display:flex;justify-content:center;gap:20px;margin:12px 0}
.ps div{text-align:center}
.ps .n{font-size:15px;font-weight:700;color:#ff44cc}
.ps .lbl{font-size:10px;color:#aa66cc;text-transform:uppercase}
.cd{background:linear-gradient(145deg,#1a0a2e,#0d0520);border-radius:12px;padding:12px;margin-top:12px;border:2px solid rgba(255,0,200,0.2)}
.cd h3{color:#ff66dd;font-size:12px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.cd .sr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.cd .sr:last-child{border-bottom:0}
.cd .sl{color:#aa66cc;font-size:12px}
.cd .sv{color:#ff44cc;font-weight:700;font-size:12px}
.tw{display:flex;align-items:center;gap:10px;padding:4px 0}
.tg{width:40px;height:22px;background:#333;border-radius:11px;cursor:pointer;position:relative;transition:all .3s}
.tg.on{background:#ff44cc}
.tg .kb{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:all .3s}
.tg.on .kb{left:20px}
.so{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,0.95);z-index:100;display:none;flex-direction:column;padding:40px 20px}
.so.s{display:flex}
.so input{padding:16px;border-radius:12px;border:1px solid rgba(255,0,200,0.3);background:#12121a;color:#fff;font-size:18px;outline:0;margin-bottom:16px}
.so input:focus{border-color:#ff44cc}
.so .cb{position:absolute;top:12px;right:16px;font-size:28px;color:#ff44cc;cursor:pointer;background:0;border:0}
.so .res{color:#aa66cc;font-size:14px}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div id=app>
<div class=hdr><span class=hdr-t>⬇️ X10</span><div class=hdr-r><button class=hdr-s id=sBtn>🔍</button></div></div>
<div class=stabs id=stabs><span class="stab a" data-pg=fyp>For You</span><span class=stab data-pg=movies>Movies</span></div>
<div class=cnt>
<div class="pg a" id=pg-fyp><div class=vf id=vFeed></div></div>
<div class=pg id=pg-movies><h2 style=color:#ff66dd;margin-bottom:12px;font-size:15px;>🎬 Movie Library</h2><p style=color:#aa66cc;font-size:12px;>Coming soon - Add your videos here</p></div>
<div class=pg id=pg-live><h2 style=color:#ff66dd;margin-bottom:12px;font-size:15px;>🔴 Live</h2><p style=color:#aa66cc;font-size:12px;>Coming soon - Add live streams here</p></div>
<div class=pg id=pg-dl><h2 style=color:#ff66dd;margin-bottom:12px;font-size:15px;>⬇️ Download</h2><div class=di><input type=text placeholder="Paste video link..." id=dlLink><button onclick=startDL()>Get</button></div><div id=dlList><p style=color:#aa66cc;font-size:12px;>No downloads yet.</p></div></div>
<div class=pg id=pg-acct>
<div class=ph><div class=pa id=pAv>👤</div><div class=pn id=pName>User</div><div style=color:#aa66cc;font-size:11px; id=pId>Loading...</div></div>
<div class=ps><div><div class=n id=fCount>0</div><div class=lbl>Followers</div></div><div><div class=n id=pCount>0</div><div class=lbl>Posts</div></div><div><div class=n id=rCount>0</div><div class=lbl>Reposts</div></div></div>
<div class=cd id=cDash style=display:none>
<h3>👑 Creator Dashboard</h3>
<div class=sr><span class=sl>Total Users</span><span class=sv id=tUsers>0</span></div>
<div class=sr><span class=sl>Subscribers</span><span class=sv id=tSubs>0</span></div>
<div class=sr><span class=sl>Monetization</span><div class=tw><div class=tg id=mToggle onclick=toggleM()><div class=kb></div></div><span style=font-size:11px;color:#aa66cc; id=mLabel>OFF</span></div></div>
<div class=sr><span class=sl>Revenue (₦)</span><span class=sv id=rDisplay>0</span></div>
</div>
</div>
</div>
<div class=so id=sOverlay><button class=cb id=cSearch>✕</button><input type=text id=sInput placeholder="Search videos..."><div class=res id=sResults>Type to search...</div></div>
<div class=bnav id=bNav>
<button class="ni a" data-tab=home><span class=nic>🏠</span>Home</button>
<button class=ni data-tab=live><span class=nic>🔴</span>Live</button>
<button class=ni data-tab=dl><span class=nic>⬇️</span>DL</button>
<button class=ni data-tab=acct><span class=nic>👤</span>Account</button>
</div>
</div>
<script>
const SB_URL="https://gkfivuvtpfetzatz.supabase.co",SB_KEY="sb_publishable_T2Sxps8oB5i1Nda3IU1SZQ_1LLxmVSE",SB=Supabase.createClient(SB_URL,SB_KEY),CID="f05ebc04-793b-42fe-a07b-08568a9c2206",VER="1.0.6",SV=localStorage.getItem('x10_version');if(SV&&SV!==VER){alert("📢 New update available! Refreshing...");localStorage.setItem('x10_version',VER);location.reload()}else if(!SV){localStorage.setItem('x10_version',VER)}console.log("✅ Version:",VER);
let ct='home',mon=false;
const vids=[{id:1,user:'@x10_creator',likes:24,cmts:5},{id:2,user:'@tech_fan',likes:18,cmts:3},{id:3,user:'@movie_buff',likes:42,cmts:8},{id:4,user:'@live_sports',likes:31,cmts:6}];
function rV(){document.getElementById('vFeed').innerHTML=vids.map(v=>`<div class=vc><div class=vp><span class=pi>▶️</span></div><div class=vi><span class=vu>${v.user}</span><div class=va><button onclick="like(${v.id})">❤️ ${v.likes}</button><button onclick="cmt(${v.id})">💬 ${v.cmts}</button><button onclick="pin(${v.id})">📌</button><button onclick="share(${v.id})">↗️</button></div></div></div>`).join('')}
function like(i){alert('❤️ Liked #'+i)}function cmt(i){const m=prompt('💬 Comment:');if(m)alert('Comment: '+m)}function pin(i){alert('📌 Pinned #'+i)}function share(i){alert('↗️ Shared #'+i)}function startDL(){const l=document.getElementById('dlLink').value;if(!l){alert('Paste a link first.');return}alert('⬇️ Downloading: '+l);document.getElementById('dlLink').value=''}
document.getElementById('sBtn').onclick=function(){document.getElementById('sOverlay').classList.add('s');document.getElementById('sInput').focus()};document.getElementById('cSearch').onclick=function(){document.getElementById('sOverlay').classList.remove('s')};document.getElementById('sInput').oninput=function(){const q=this.value.toLowerCase(),res=document.getElementById('sResults');if(!q){res.innerHTML='Type to search...';return}const r=vids.filter(v=>v.user.toLowerCase().includes(q));if(r.length){res.innerHTML=r.map(v=>`<div style=padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);color:#ff88ee;>${v.user}</div>`).join('')}else{res.innerHTML='<span style=color:#aa66cc;>No results found.</span>'}};
function navTo(t){ct=t;document.querySelectorAll('.ni').forEach(b=>{b.classList.remove('a');if(b.dataset.tab===t)b.classList.add('a')});document.querySelectorAll('.pg').forEach(p=>p.classList.remove('a'));const map={home:'pg-fyp',live:'pg-live',dl:'pg-dl',acct:'pg-acct'};const tg=document.getElementById(map[t]);if(tg)tg.classList.add('a');document.getElementById('stabs').style.display=t==='home'?'flex':'none';if(t==='acct')loadAcct()}
document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.ni').forEach(b=>{b.addEventListener('click',function(e){e.preventDefault();navTo(this.dataset.tab)})});document.querySelectorAll('.stab').forEach(t=>{t.addEventListener('click',function(){document.querySelectorAll('.stab').forEach(s=>s.classList.remove('a'));this.classList.add('a');const p=this.dataset.pg;document.querySelectorAll('.pg').forEach(s=>s.classList.remove('a'));document.getElementById('pg-'+p).classList.add('a')})});document.querySelectorAll('.pg').forEach(p=>p.classList.remove('a'));document.getElementById('pg-fyp').classList.add('a');rV();console.log('✅ Ready!')});
async function loadAcct(){const{data:{user}}=await SB.auth.getUser();if(!user){document.getElementById('pName').textContent='Not Signed In';document.getElementById('pId').textContent='Tap to login';document.getElementById('pAv').textContent='🔒';return}const c=user.id===CID;document.getElementById('pName').textContent=user.user_metadata?.full_name||user.email||'User';document.getElementById('pId').textContent='@'+(user.user_metadata?.username||'user');document.getElementById('pAv').textContent=(user.user_metadata?.full_name||'U')[0].toUpperCase();if(c){document.getElementById('cDash').style.display='block';document.getElementById('tUsers').textContent='47';document.getElementById('tSubs').textContent='12';document.getElementById('rDisplay').textContent='₦8,400'}else{document.getElementById('cDash').style.display='none'}}
function toggleM(){const t=document.getElementById('mToggle'),l=document.getElementById('mLabel');mon=!mon;t.classList.toggle('on',mon);l.textContent=mon?'ON':'OFF';l.style.color=mon?'#ff44cc':'#aa66cc';alert('💰 Monetization '+(mon?'ENABLED':'DISABLED'))}
let et=0;window.addEventListener('popstate',function(e){if(et===0){et=1;setTimeout(()=>{et=0},500)}else{if(confirm('Exit X10 Downloader?')){window.close()}et=0}});history.pushState({page:'home'},'');
console.log('🚀 X10 Downloader ready!');
</script>
</body>
</html>
