<!DOCTYPE html>
<html lang="en">
<head>

    <title>X10 Downloader</title>

    <style>
        :root { --accent: #ff007f; --bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Tactical Feedback Styles */
        .nav-btn { color: #555; transition: 0.3s; cursor: pointer; }
        .nav-btn.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        
        #view-container { flex: 1; overflow-y: auto; }
        .view { display: none; padding: 20px; }
        
        nav { background: #151515; padding: 15px; display: flex; justify-content: space-around; border-top: 1px solid #333; }
        .search-trigger { background: #222; padding: 12px; border-radius: 8px; margin: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="view-container">
        <div id="home" class="view" style="display:block;">
            <div class="search-trigger" onclick="openSearch()">Search Movies, Shows, Links...</div>
            <div id="fyp-feed"></div>
        </div>
        </div>

    <nav>
        <div class="nav-btn active" onclick="switchTab(this, 'home')">Home</div>
        <div class="nav-btn" onclick="switchTab(this, 'live')">Live</div>
        <div class="nav-btn" onclick="switchTab(this, 'download')">Downloads</div>
    </nav>

    <script>
        // Double-Back Exit Logic
        let backCount = 0;
        document.addEventListener('backbutton', () => {
            if (backCount === 0) {
                backCount++;
                alert("Press back again to exit");
                setTimeout(() => backCount = 0, 2000);
            } else {
                navigator.app.exitApp();
            }
        });

        // Tab Switching with Tactile Feedback
        function switchTab(el, tabId) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

</body>
