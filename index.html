<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 DOWNLOADER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animated Background Frame */
        body { 
            background: linear-gradient(-45deg, #0b0813, #1e1b4b, #312e81, #1e1b2e); 
            background-size: 400% 400%; 
            animation: moveGradient 10s ease infinite; 
            color: #fff; 
            font-family: sans-serif;
        }
        @keyframes moveGradient { 0% { background-position: 0% 50% } 50% { background-position: 100% 50% } 100% { background-position: 0% 50% } }
        
        /* Layout Sections */
        .page { display: none; }
        .page.active { display: block; }
        
        /* Nav Highlighting */
        .nav-link { color: #818cf8; transition: 0.3s; }
        .nav-link.active { color: #fb7185; border-bottom: 2px solid #fb7185; font-weight: bold; }
        
        /* Button Feedback */
        button:active { transform: scale(0.98); }
    </style>
</head>
<body class="pb-24">

    <div id="search-zone" class="p-4 bg-[#0b0813]/80 border-b border-indigo-900 sticky top-0 z-50">
        <div class="flex gap-2">
            <input id="q" type="text" placeholder="Search global movies..." class="flex-1 bg-[#130f22] p-2 rounded text-xs border border-indigo-500/50 text-white placeholder-indigo-400">
            <button onclick="alert('Search Active')" class="bg-indigo-600 px-4 rounded text-xs font-bold text-white shadow-lg">GO</button>
        </div>
    </div>

    <main class="p-4">
        <div id="page-home" class="page active">
            <h2 class="text-indigo-400 font-bold mb-4 border-l-4 border-indigo-500 pl-2 text-xs uppercase">For You Feed</h2>
            <div id="home-content" class="min-h-[50vh] bg-[#0b0813]/40 rounded-xl border border-indigo-900/50 p-4"></div>
        </div>

        <div id="page-live" class="page">
            <h2 class="text-emerald-400 font-bold mb-4 border-l-4 border-emerald-500 pl-2 text-xs uppercase">Live Relays</h2>
            <div id="live-content" class="min-h-[50vh] bg-[#0b0813]/40 rounded-xl border border-emerald-900/50 p-4"></div>
        </div>

        <div id="page-library" class="page">
            <h2 class="text-purple-400 font-bold mb-4 border-l-4 border-purple-500 pl-2 text-xs uppercase">My Library</h2>
            <div id="lib-content" class="min-h-[50vh] bg-[#0b0813]/40 rounded-xl border border-purple-900/50 p-4"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-[#0b0813] p-4 flex justify-around border-t border-indigo-900 z-50">
        <button onclick="nav('home')" id="btn-home" class="nav-link active text-[10px]">HOME</button>
        <button onclick="nav('live')" id="btn-live" class="nav-link text-[10px]">LIVE</button>
        <button onclick="nav('library')" id="btn-library" class="nav-link text-[10px]">LIBRARY</button>
    </nav>

    <script>
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            document.getElementById('search-zone').style.display = (id === 'library') ? 'none' : 'block';
        }
    </script>
</body>
</html>
