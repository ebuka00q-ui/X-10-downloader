<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X10 Downloader</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;
    const supabase = createClient("https://gkfivuvtpfetzatz.supabase.co", "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE");

    const X10App = () => {
      const [currentTab, setCurrentTab] = useState('home');
      const [subTab, setSubTab] = useState('active'); // For Live or Home segments
      const [searchQuery, setSearchQuery] = useState('');

      return (
        <div className="flex flex-col h-full">
          {/* Header with Dynamic Search */}
          <header className="p-4 border-b border-gray-800 flex justify-between items-center">
            <h1 className="text-xl font-bold uppercase">{currentTab}</h1>
            <input 
              type="text" 
              placeholder={`Search in ${currentTab}...`}
              className="bg-gray-900 p-2 rounded-lg text-sm w-1/2"
              onChange={(e) => setSearchQuery(e.target.value)}
            />
          </header>

          {/* Dynamic Main Content */}
          <main className="flex-1 overflow-y-auto p-4">
            {currentTab === 'home' && (
              <div>
                <div className="flex gap-4 mb-4">
                  <button onClick={() => setSubTab('fyp')} className={subTab === 'fyp' ? 'font-bold' : 'text-gray-500'}>For You</button>
                  <button onClick={() => setSubTab('movie')} className={subTab === 'movie' ? 'font-bold' : 'text-gray-500'}>Movies</button>
                </div>
                {/* Content logic: Search {searchQuery} in {subTab} */}
              </div>
            )}

            {currentTab === 'live' && (
              <div>
                <div className="flex gap-4 mb-4">
                  <button onClick={() => setSubTab('active')} className={subTab === 'active' ? 'font-bold' : 'text-gray-500'}>Active</button>
                  <button onClick={() => setSubTab('preview')} className={subTab === 'preview' ? 'font-bold' : 'text-gray-500'}>Preview</button>
                </div>
                {/* Logic: If preview, filter matches < 7 days old from Supabase */}
              </div>
            )}
          </main>

          {/* Navigation */}
          <nav className="h-20 bg-black border-t border-gray-800 flex justify-around items-center">
            {['home', 'live', 'downloads', 'account'].map(tab => (
              <button key={tab} onClick={() => setCurrentTab(tab)} className="capitalize text-xs">{tab}</button>
            ))}
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<X10App />);
  </script>
</body>
</html>
