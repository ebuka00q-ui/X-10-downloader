<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X10 Downloader</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    // 1. SUPABASE INITIALIZATION
    const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const X10App = () => {
      const [currentTab, setCurrentTab] = useState('home');
      const [showExitModal, setShowExitModal] = useState(false);
      const [isCreator] = useState(true);

      // 2. BACK BUTTON PROTOCOL
      useEffect(() => {
        let backPressCount = 0;
        const handlePopState = () => {
          backPressCount++;
          if (backPressCount >= 2) {
            setShowExitModal(true);
            backPressCount = 0;
          } else {
            window.history.back();
          }
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      return (
        <div className="w-full h-screen flex flex-col">
          {/* 3. MAIN CONTENT AREA */}
          <main className="flex-1 overflow-y-auto p-4">
            {currentTab === 'home' && <div>Home/FYP Content</div>}
            {currentTab === 'account' && (
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h1 className="text-2xl font-bold">Profile</h1>
                  {isCreator && <button className="bg-gray-800 px-3 py-1 rounded">...</button>}
                </div>
                <div className="text-2xl font-bold">{isCreator ? "100,000,000+ Followers" : "Followers"}</div>
              </div>
            )}
          </main>

          {/* 4. PERSISTENT NAVIGATION */}
          <nav className="flex justify-around py-4 border-t border-gray-800 bg-black">
            <button onClick={() => setCurrentTab('home')}>Home</button>
            <button onClick={() => setCurrentTab('live')}>Live</button>
            <button onClick={() => setCurrentTab('downloads')}>Downloads</button>
            <button onClick={() => setCurrentTab('account')}>Account</button>
          </nav>

          {/* 5. EXIT MODAL */}
          {showExitModal && (
            <div className="fixed inset-0 flex items-center justify-center bg-black/80 z-50">
              <div className="bg-gray-900 p-6 rounded-lg text-center">
                <p className="mb-4">Exit App?</p>
                <button onClick={() => window.close()} className="mr-4 bg-red-600 px-4 py-2 rounded">Exit</button>
                <button onClick={() => setShowExitModal(false)} className="bg-gray-700 px-4 py-2 rounded">Cancel</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<X10App />);
  </script>
</body>
</html>
