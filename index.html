<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>X10 Downloader</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0f;color:#fff;height:100vh;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;background:#0a0a0f;max-width:500px;margin:0 auto;width:100%}

/* ===== HIDE RADIO BUTTONS ===== */
.tab-radio{display:none}

/* ===== HEADER ===== */
.hdr{padding:10px 16px 8px;background:#0a0a0f;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,0,200,0.15);flex-shrink:0}
.hdr-t{font-size:18px;font-weight:900;background:linear-gradient(135deg,#ff66dd,#cc00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-r{display:flex;align-items:center;gap:16px}
.hdr-s{font-size:22px;color:#ff44cc;cursor:pointer;background:0;border:0;padding:4px}
.hdr-a{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff44cc,#aa00cc);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;cursor:pointer;border:2px solid rgba(255,0,200,0.3)}

/* ===== SUB TABS ===== */
.stabs{display:flex;padding:8px 16px 0;gap:20px;background:#0a0a0f;border-bottom:1px solid rgba(255,0,200,0.08);flex-shrink:0}
.stab{padding:8px 4px 12px;font-size:13px;font-weight:600;color:#555;cursor:pointer;border-bottom:3px solid transparent;text-transform:uppercase}
.stab.a{color:#ff44cc;border-bottom-color:#ff44cc}

/* ===== CONTENT ===== */
.cnt{flex:1;overflow:hidden;position:relative}
.pg{display:none;height:100%;overflow-y:auto;padding:12px;scroll-behavior:smooth}
.pg.a{display:block}

/* ===== VIDEOS ===== */
.vf{display:flex;flex-direction:column;gap:14px;padding-bottom:80px}
.vc{background:linear-gradient(145deg,#12121a,#0d0d15);border-radius:14px;overflow:hidden;border:1px solid rgba(255,0,200,0.1)}
.vp{width:100%;aspect-ratio:9/16;background:linear-gradient(145deg,#1a0a2e,#0d0520);display:flex;align-items:center;justify-content:center;min-height:200px}
.vp .pi{font-size:48px;color:#ff44cc;opacity:.5}
.vi{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,0.6)}
.vu{font-weight:600;color:#ff66dd;font-size:13px}
.va{display:flex;gap:12px;align-items:center}
.va button{background:0;border:0;color:#888;font-size:16px;cursor:pointer;padding:4px}

/* ===== BOTTOM NAV ===== */
.bnav{display:flex;justify-content:space-around;align-items:center;padding:8px 0 14px;background:rgba(10,10,15,0.97);border-top:1px solid rgba(255,0,200,0.12);flex-shrink:0;position:sticky;bottom:0;z-index:20}
.bnav label{display:flex;flex-direction:column;align-items:center;color:#555;font-size:9px;cursor:pointer;padding:4px 12px;font-family:inherit}
.bnav label .nic{font-size:20px}
.bnav label.active{color:#ff44cc}

/* ===== PAGE VISIBILITY ===== */
#tab-home:checked ~ .cnt #page-home,
#tab-live:checked ~ .cnt #page-live,
#tab-watch:checked ~ .cnt #page-watch,
#tab-account:checked ~ .cnt #page-account{display:block}

/* ===== WATCH TAB ===== */
.di{display:flex;gap:10px;margin-bottom:12px}
.di input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,0,200,0.2);background:#12121a;color:#fff;font-size:14px;outline:0}
.di input:focus{border-color:#ff44cc}
.di button{padding:12px 20px;border-radius:12px;border:0;background:linear-gradient(135deg,#ff44cc,#aa00cc);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.player-box{width:100%;border-radius:12px;margin-top:10px;background:#0d0d15;border:1px solid rgba(255,0,200,0.1);overflow:hidden;min-height:300px;display:flex;align-items:center;justify-content:center}
.player-box video,.player-box iframe{width:100%;border:none;border-radius:10px;display:block;max-height:500px;background:#000}
.player-box iframe{height:400px}

/* ===== ACCOUNT ===== */
.ph{text-align:center;padding:16px 0}
.pa{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff44cc,#aa00cc);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#fff;border:3px solid rgba(255,0,200,0.25);cursor:pointer;overflow:hidden}
.pa img{width:100%;height:100%;object-fit:cover}
.pn{font-size:19px;font-weight:700;color:#ff88ee}
.pn input{background:#12121a;border:1px solid rgba(255,0,200,0.2);border-radius:8px;padding:6px 12px;color:#ff88ee;font-size:17px;font-weight:700;text-align:center;outline:0;width:200px}
.pn input:focus{border-color:#ff44cc}
.ps{display:flex;justify-content:center;gap:24px;margin:14px 0}
.ps div{text-align:center}
.ps .n{font-size:17px;font-weight:700;color:#ff44cc}
.ps .lbl{font-size:10px;color:#aa66cc;text-transform:uppercase}
.cd{background:linear-gradient(145deg,#1a0a2e,#0d0520);border-radius:14px;padding:14px;margin-top:14px;border:2px solid rgba(255,0,200,0.1)}
.cd h3{color:#ff66dd;font-size:13px;margin-bottom:12px;text-transform:uppercase}
.cd .sr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.cd .sr:last-child{border-bottom:0}
.cd .sl{color:#aa66cc;font-size:13px}
.cd .sv{color:#ff44cc;font-weight:700;font-size:13px}

/* ===== SEARCH ===== */
.so{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,0.97);z-index:100;display:none;flex-direction:column;padding:50px 24px}
.so.s{display:flex}
.so input{padding:18px;border-radius:14px;border:1px solid rgba(255,0,200,0.25);background:#12121a;color:#fff;font-size:18px;outline:0;margin-bottom:18px}
.so .cb{position:absolute;top:16px;right:20px;font-size:30px;color:#ff44cc;cursor:pointer;background:0;border:0}
.so .res{color:#aa66cc;font-size:15px}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<div id="app">

<!-- ===== RADIO BUTTONS FOR NAVIGATION ===== -->
<input type="radio" name="tab" id="tab-home" class="tab-radio" checked>
<input type="radio" name="tab" id="tab-live" class="tab-radio">
<input type="radio" name="tab" id="tab-watch" class="tab-radio">
<input type="radio" name="tab" id="tab-account" class="tab-radio">

<!-- ===== HEADER ===== -->
<div class="hdr">
<span class="hdr-t">⬇️ X10</span>
<div class="hdr-r">
<button class="hdr-s" id="searchBtn">🔍</button>
<label class="hdr-a" for="tab-account">👤</label>
</div>
</div>

<!-- ===== SUB TABS ===== -->
<div class="stabs" id="subTabs">
<span class="stab a" data-page="fyp">For You</span>
<span class="stab" data-page="movies">Movies</span>
</div>

<!-- ===== CONTENT ===== -->
<div class="cnt">

<!-- HOME -->
<div class="pg a" id="page-home">
<div class="vf">
<div class="vc"><div class="vp"><span class="pi">▶️</span></div><div class="vi"><span class="vu">@x10_creator</span><div class="va"><button onclick="alert('❤️ Liked!')">❤️ 24</button><button onclick="prompt('💬 Comment:')">💬 5</button><button onclick="alert('📌 Pinned!')">📌</button><button onclick="alert('↗️ Shared!')">↗️</button></div></div></div>
<div class="vc"><div class="vp"><span class="pi">▶️</span></div><div class="vi"><span class="vu">@tech_fan</span><div class="va"><button onclick="alert('❤️ Liked!')">❤️ 18</button><button onclick="prompt('💬 Comment:')">💬 3</button><button onclick="alert('📌 Pinned!')">📌</button><button onclick="alert('↗️ Shared!')">↗️</button></div></div></div>
</div>
</div>

<!-- LIVE -->
<div class="pg" id="page-live">
<h2 style="color:#ff66dd;margin-bottom:14px;font-size:17px;">🔴 Live</h2>
<p style="color:#aa66cc;font-size:13px;">Coming soon - Add live streams here</p>
</div>

<!-- WATCH -->
<div class="pg" id="page-watch">
<h2 style="color:#ff66dd;margin-bottom:8px;font-size:17px;">▶️ Watch Any Video</h2>
<p style="color:#aa66cc;font-size:12px;margin-bottom:12px;">Paste any link: MP4, YouTube, or website</p>
<div class="di">
<input type="text" placeholder="Paste link here..." id="videoLink">
<button onclick="playVideo()">▶ Watch</button>
</div>
<div class="player-box" id="playerContainer">
<div id="noVideoMsg" style="color:#555;font-size:14px;text-align:center;padding:20px;">
⬇️ Paste a link and click Watch
</div>
</div>
</div>

<!-- ACCOUNT -->
<div class="pg" id="page-account">
<div class="ph">
<div class="pa" id="profileAvatar" onclick="uploadPhoto()">👤</div>
<div class="pn"><input type="text" id="usernameInput" value="Creator" maxlength="20" onchange="saveUsername()"></div>
<div style="color:#aa66cc;font-size:12px;" id="profileId">@x10_creator</div>
</div>
<div class="ps">
<div><div class="n" id="followersCount">100M</div><div class="lbl">Followers</div></div>
<div><div class="n" id="postsCount">47</div><div class="lbl">Posts</div></div>
<div><div class="n" id="repostsCount">12</div><div class="lbl">Reposts</div></div>
</div>
<div class="cd" id="creatorDash">
<h3>📊 Dashboard</h3>
<div class="sr"><span class="sl">Total Users</span><span class="sv" id="totalUsers">1</span></div>
<div class="sr"><span class="sl">Total Posts</span><span class="sv" id="totalPosts">47</span></div>
</div>
</div>

</div>

<!-- ===== SEARCH OVERLAY ===== -->
<div class="so" id="searchOverlay">
<button class="cb" id="closeSearch">✕</button>
<input type="text" id="searchInput" placeholder="Search videos...">
<div class="res" id="searchResults">Type to search...</div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<div class="bnav">
<label for="tab-home" id="nav-home"><span class="nic">🏠</span>Home</label>
<label for="tab-live" id="nav-live"><span class="nic">🔴</span>Live</label>
<label for="tab-watch" id="nav-watch"><span class="nic">▶️</span>Watch</label>
<label for="tab-account" id="nav-account"><span class="nic">👤</span>Account</label>
</div>

</div>

<script>
// =============================================
// VERSION CONTROL
// =============================================
const APP_VERSION = "1.0.0";
const STORED_VERSION = localStorage.getItem('x10_version');
if (STORED_VERSION && STORED_VERSION !== APP_VERSION) {
    alert("📢 New update available! Refreshing...");
    localStorage.setItem('x10_version', APP_VERSION);
    location.reload();
} else if (!STORED_VERSION) {
    localStorage.setItem('x10_version', APP_VERSION);
}
console.log("✅ Version:", APP_VERSION);

// =============================================
// VIDEO PLAYER
// =============================================
function playVideo() {
    const link = document.getElementById('videoLink').value.trim();
    const container = document.getElementById('playerContainer');
    if (!link) { alert('Please paste a link first.'); return; }
    container.innerHTML = '';
    if (link.includes('youtube.com/watch') || link.includes('youtu.be/')) {
        let videoId = '';
        if (link.includes('v=')) videoId = link.split('v=')[1].split('&')[0];
        else if (link.includes('youtu.be/')) videoId = link.split('youtu.be/')[1].split('?')[0];
        if (videoId) { container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allowfullscreen></iframe>`; return; }
    }
    const videoExts = ['.mp4', '.webm', '.ogg', '.mov', '.avi', '.mkv'];
    if (videoExts.some(ext => link.toLowerCase().includes(ext))) {
        container.innerHTML = `<video controls autoplay><source src="${link}"></video>`;
        return;
    }
    container.innerHTML = `<iframe src="${link}" allowfullscreen></iframe>`;
}

// =============================================
// PROFILE - PHOTO
// =============================================
function uploadPhoto() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('profileAvatar').innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                localStorage.setItem('x10_avatar', ev.target.result);
            };
            reader.readAsDataURL(file);
        }
    };
    input.click();
}

// =============================================
// PROFILE - USERNAME
// =============================================
function saveUsername() {
    const name = document.getElementById('usernameInput').value.trim() || 'Creator';
    localStorage.setItem('x10_username', name);
    document.getElementById('profileId').textContent = '@' + name.toLowerCase().replace(/\s/g, '_');
}

// Load saved data
const savedName = localStorage.getItem('x10_username');
if (savedName) {
    document.getElementById('usernameInput').value = savedName;
    document.getElementById('profileId').textContent = '@' + savedName.toLowerCase().replace(/\s/g, '_');
}
const savedAvatar = localStorage.getItem('x10_avatar');
if (savedAvatar) {
    document.getElementById('profileAvatar').innerHTML = `<img src="${savedAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
}

// =============================================
// SEARCH
// =============================================
document.getElementById('searchBtn').onclick = function() {
    document.getElementById('searchOverlay').classList.add('s');
    document.getElementById('searchInput').focus();
};
document.getElementById('closeSearch').onclick = function() {
    document.getElementById('searchOverlay').classList.remove('s');
};
document.getElementById('searchInput').oninput = function() {
    const q = this.value.toLowerCase();
    const res = document.getElementById('searchResults');
    if (!q) { res.innerHTML = 'Type to search...'; return; }
    res.innerHTML = '<span style="color:#aa66cc;">🔍 Searching for: "' + q + '"</span>';
};

// =============================================
// SUB-TABS
// =============================================
document.querySelectorAll('.stab').forEach(tab => {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.stab').forEach(t => t.classList.remove('a'));
        this.classList.add('a');
    });
});

// =============================================
// EXIT
// =============================================
let exitTimer = 0;
window.addEventListener('popstate', function() {
    if (exitTimer === 0) {
        exitTimer = 1;
        setTimeout(() => { exitTimer = 0; }, 500);
    } else {
        if (confirm('Exit X10 Downloader?')) { window.close(); }
        exitTimer = 0;
    }
});
history.pushState({ page: 'home' }, '');

console.log('🚀 X10 Downloader Ready!');
</script>

</body>
    </html>
