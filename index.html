<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 DOWNLOADER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Rich, deep color theme */
        body { background: linear-gradient(135deg, #0b0813, #1e1b2e, #0f0b1a); color: #fff; min-height: 100vh; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* Navigation Color States */
        .nav-link { color: #818cf8; transition: all 0.3s; }
        .nav-link.active { color: #ff007f; border-bottom: 2px solid #ff007f; font-weight: bold; }
        
        /* Search Bar Color */
        .search-box { background: rgba(76, 29, 149, 0.3); border: 1px solid #6366f1; }
    </style>
</head>
<body class="pb-20">

    <!-- SEARCH BAR WITH HISTORY -->
    <div id="search-zone" class="p-4 border-b border-indigo-900 sticky top-0 z-50 bg-[#0b0813]/90">
        <div class="flex gap-2">
            <input id="search-input" type="text" placeholder="Search..." class="search-box flex-1 p-2 rounded text-xs text-white placeholder-indigo-400">
            <button onclick="runSearch()" class="bg-indigo-600 px-4 rounded text-xs font-bold text-white shadow-[0_0_10px_#6366f1]">GO</button>
        </div>
        <div id="history-list" class="mt-2 flex gap-2 overflow-x-auto text-[9px] text-indigo-400"></div>
    </div>

    <main class="p-4">
        <!-- HOME PAGE -->
        <div id="page-home" class="page active">
            <h2 class="text-indigo-400 font-bold mb-4 border-l-4 border-indigo-500 pl-2">HOME FEED</h2>
            <div id="home-content" class="space-y-4"></div>
        </div>

        <!-- LIVE PAGE -->
        <div id="page-live" class="page">
            <h2 class="text-pink-500 font-bold mb-4 border-l-4 border-pink-500 pl-2">LIVE RELAYS</h2>
            <div id="live-content" class="space-y-4"></div>
        </div>

        <!-- LIBRARY PAGE -->
        <div id="page-downloads" class="page">
            <h2 class="text-purple-400 font-bold mb-4 border-l-4 border-purple-500 pl-2">LIBRARY</h2>
            <div id="dwn-content" class="space-y-4"></div>
        </div>
    </main>

    <!-- COLORFUL NAVIGATION -->
    <nav class="fixed bottom-0 w-full bg-[#130f22] p-4 flex justify-around text-[10px] border-t border-indigo-900 z-50">
        <button id="btn-home" onclick="nav('home')" class="nav-link active">HOME</button>
        <button id="btn-live" onclick="nav('live')" class="nav-link">LIVE</button>
        <button id="btn-downloads" onclick="nav('downloads')" class="nav-link">LIBRARY</button>
    </nav>

    <script>
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            document.getElementById('search-zone').style.display = (id === 'downloads') ? 'none' : 'block';
        }

        function runSearch() {
            let q = document.getElementById('search-input').value;
            if(!q) return;
            let hist = JSON.parse(localStorage.getItem('x10_h') || '[]');
            if(!hist.includes(q)) hist.push(q);
            localStorage.setItem('x10_h', JSON.stringify(hist.slice(-5)));
            renderHistory();
            document.getElementById('search-input').value = '';
        }

        function renderHistory() {
            document.getElementById('history-list').innerHTML = 
                JSON.parse(localStorage.getItem('x10_h') || '[]').map(h => `<span>${h}</span>`).join(' | ');
        }

        renderHistory();
    </script>
</body>
</html>
