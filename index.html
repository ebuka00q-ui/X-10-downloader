<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>X10 Downloader</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const X10App = () => {
      const [currentTab, setCurrentTab] = useState('home');

      return (
        <div className="flex flex-col h-screen">
          <main className="flex-1 p-4">
            <h1 className="text-xl font-bold">X10 Downloader</h1>
            <div className="mt-4">Current Tab: {currentTab}</div>
          </main>

          <nav className="flex justify-around py-4 border-t border-gray-800">
            <button onClick={() => setCurrentTab('home')}>Home</button>
            <button onClick={() => setCurrentTab('account')}>Account</button>
          </nav>
        </div>
      );
    };

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<X10App />);
  </script>

</body>
</html>
