<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>X10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:linear-gradient(-45deg,#0b0813,#1a0b2e,#0d1b3e,#14051c);background-size:400% 400%;animation:L 8s infinite;color:#fff;font-family:sans-serif}
        @keyframes L{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
        .P,.S{display:none!important}.P.active,.S.active{display:block!important}
        .F{scroll-snap-type:y mandatory;overflow-y:scroll;height:calc(100vh - 240px);scrollbar-width:none}
        .F::-webkit-scrollbar{display:none}.C{scroll-snap-align:start;height:100%;position:relative}
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20 select-none">
    <div id="search-overlay" class="hidden fixed inset-0 bg-[#0b0813]/95 backdrop-blur-md z-50 p-4 flex flex-col">
        <div class="max-w-md mx-auto w-full space-y-4 pt-10">
            <div class="flex justify-between items-center"><h2 id="search-title" class="text-xs font-bold text-indigo-400 uppercase">Search</h2><button id="btn-close-search" class="text-xs text-red-400 bg-red-950/40 px-2 py-1 rounded">✕</button></div>
            <div class="flex gap-2"><input id="overlay-search-input" type="text" placeholder="Search" class="flex-1 bg-[#130f22] border border-gray-700 rounded p-2 text-xs text-white focus:outline-none"><button id="btn-submit-search" class="bg-indigo-600 px-3 rounded text-xs font-bold whitespace-nowrap">Continuous Search</button></div>
            <div id="search-results-viewport" class="space-y-2 overflow-y-auto max-h-[60vh]"></div>
        </div>
    </div>
    <main class="flex-1 max-w-md mx-auto w-full p-4 space-y-4">
        <div id="page-home" class="P active space-y-4">
            <div class="flex justify-between items-center bg-[#130f22]/60 border border-white/5 p-4 rounded-2xl shadow-xl">
                <h1 class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">X10 DOWNLOADER</h1>
                <button id="btn-trigger-search" class="bg-indigo-500/10 text-xs px-3 py-1.5 rounded-xl text-indigo-400">🔍 Search</button>
            </div>
            <div class="flex text-center text-xs font-bold border-b border-white/5 uppercase">
                <button id="btn-sub-foryou" class="flex-1 pb-2 border-b-2 border-indigo-500 text-white font-bold">For You (FYP)</button>
                <button id="btn-sub-movies" class="flex-1 pb-2 border-b-2 border-transparent text-gray-400">Movies</button>
            </div>
            <div id="sub-foryou" class="S active"><div class="F border border-white/5 rounded-2xl bg-black overflow-hidden"></div></div>
            <div id="sub-movies" class="S"><div class="grid grid-cols-2 gap-3"></div></div>
        </div>
        <div id="page-workspace" class="P space-y-4">
            <div class="space-y-2">
                <div class="relative aspect-video bg-black rounded-2xl overflow-hidden border border-white/5 flex flex-col justify-end">
                    <video id="workspace-video-player" controls playsinline class="w-full h-full object-contain"></video>
                    <div id="subtitles-container" class="absolute bottom-12 inset-x-0 text-center pointer-events-none px-4 hidden"><span id="subtitles-text" class="bg-black/80 text-white px-2 py-1 rounded text-xs inline-block max-w-[95%] border border-white/10 shadow-md"></span></div>
                </div>
                <h2 id="workspace-preview-title" class="text-xs font-bold text-gray-300 px-1"></h2>
            </div>
            <div class="grid grid-cols-2 gap-3"><button id="btn-watch-now" class="bg-indigo-600 font-bold py-2 rounded-xl text-xs uppercase">▶ Watch</button><button id="btn-download-now" class="bg-emerald-600 font-bold py-2 rounded-xl text-xs uppercase">📥 Download</button></div>
            <div class="bg-[#130f22]/60 border border-white/5 rounded-2xl p-3 space-y-1"><h3 class="text-[9px] font-bold text-indigo-400 uppercase">Cast</h3><div id="workspace-actor-cast-row" class="flex gap-2 overflow-x-auto scrollbar-none"></div></div>
            <div class="bg-[#130f22]/60 border border-white/5 rounded-2xl p-3 space-y-1"><p id="workspace-movie-desc" class="text-xs text-gray-300 font-light"></p></div>
        </div>
        <div id="page-live" class="P space-y-4">
            <div class="bg-[#130f22]/60 p-3 border border-white/5 rounded-2xl flex justify-between items-center shadow-md">
                <h1 class="text-xs font-bold text-emerald-400">LIVE SPORTS</h1>
                <button id="btn-trigger-live-search" class="bg-emerald-500/10 text-xs px-2 py-1 rounded-xl text-emerald-400">🔍 Live Search</button>
            </div>
            <div class="relative aspect-video bg-black rounded-2xl overflow-hidden border border-white/5 shadow-2xl"><video id="live-video-player" controls playsinline class="w-full h-full object-cover"></video></div>
            <div id="live-feed-directory-scroller" class="space-y-2 max-h-[40vh] overflow-y-auto"></div>
        </div>
        <div id="page-downloads" class="P space-y-3">
            <div class="bg-[#130f22]/60 p-3 border border-white/5 rounded-2xl flex justify-between items-center shadow-md">
                <h1 class="text-xs font-bold text-gray-300">OFFLINE STORAGE</h1><button id="btn-clear-downloads" class="text-[9px] bg-red-950/40 text-red-400 px-2 py-1 rounded">Purge</button>
            </div>
            <div id="downloads-list" class="grid grid-cols-1 gap-2"></div>
        </div>
    </main>
    <nav class="fixed bottom-0 inset-x-0 bg-[#0d091a]/95 backdrop-blur-md border-t border-white/5 py-2.5 flex justify-around items-center z-40">
        <button id="nav-home" class="text-indigo-400 font-bold text-sm">Home</button><button id="nav-live" class="text-gray-400 text-sm">Live</button><button id="nav-downloads" class="text-gray-400 text-sm">Downloads</button>
    </nav>
    <script>
        let tab='home',subTab='foryou',sel=null,ovr=false,lastB=0;const key='5dcf7f28a88be0edc01bbbde06f024ab',curY=new Date().getFullYear();
        const catalogMovies=[
            {id:82825,title:'Ocean Frontiers',year:String(curY),desc:'Cinematic environment tracks.',video:'https://vjs.zencdn.net/v/oceans.mp4',poster:'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=200'},
            {id:49017,title:'Sintel Cut',year:String(curY),desc:'Narrative stream system logs.',video:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',poster:'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=200'}
        ];
        const fypFeeds=[
            {acct:'@scroll',title:'Endless Short Clip Loop Feed',src:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',L:'1.2M',C:'44K'},
            {acct:'@space',title:'Deep Sky Environment Architecture Track',src:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',L:'985K',C:'12K'}
        ];
        const liveDirectory=[
            {title:'Live Football Relay - Premier League',src:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'},
            {title:'Batman Broadcast Feed',src:'https://vjs.zencdn.net/v/oceans.mp4'}
        ];
        const mockSubs=[{start:1,end:4,text:"[System Syncing Video Translation]"},{start:5,end:9,text:"Continuous track stream presentation."},{start:10,end:15,text:"Audio and text frames locked to timeline."},{start:16,end:30,text:"Enjoy automated subtitles."}];
        window.switchTab=function(t){
            tab=t;document.querySelectorAll('.P').forEach(p=>p.classList.remove('active'));document.getElementById(`page-${t}`).classList.add('active');
            ['home','live','downloads'].forEach(b=>document.getElementById(`nav-${b}`).className=t===b?"text-indigo-400 font-bold text-sm":"text-gray-400 text-sm");
            document.querySelectorAll('video').forEach(v=>v.pause());if(t==='downloads')rDwn();
            if(t==='live'){rLive();let p=document.getElementById('live-video-player');if(liveDirectory.length>0){p.src=liveDirectory[0].src;p.load();p.play();}}
            if(t==='home'&&subTab==='foryou')rFyp();
        };
        window.switchHomeSubPage=function(s){
            subTab=s;document.querySelectorAll('.S').forEach(p=>p.classList.remove('active'));document.getElementById(`sub-${s}`).classList.add('active');
            document.getElementById('btn-sub-foryou').className=s==='foryou'?'flex-1 pb-2 border-b-2 border-indigo-500 text-white font-bold':'flex-1 pb-2 border-b-2 border-transparent text-gray-400';
            document.getElementById('btn-sub-movies').className=s==='movies'?'flex-1 pb-2 border-b-2 border-indigo-500 text-white font-bold':'flex-1 pb-2 border-b-2 border-transparent text-gray-400';
            document.querySelectorAll('video').forEach(v=>v.pause());if(s==='foryou')rFyp();else rCat();
        };
        function rCat(){
            let g=document.querySelector('#sub-movies .grid');g.innerHTML='';
            let flt=catalogMovies.filter(m=>m.year===String(curY)||m.year===String(curY-1));if(!flt.length)flt=catalogMovies;
            flt.forEach(m=>{
                let c=document.createElement('div');c.className="bg-[#130f22]/50 border border-white/5 p-2 rounded-2xl text-center cursor-pointer shadow-md";
                c.innerHTML=`<div class="aspect-video bg-black rounded-xl overflow-hidden mb-1"><img class="w-full h-full object-cover" src="${m.poster}"/></div><p class="text-[10px] font-bold truncate text-white">${m.title}</p><p class="text-[8px] text-indigo-400 font-mono">${m.year}</p>`;
                let a=()=>{sel=m;openW();};c.addEventListener('click',a);c.addEventListener('touchstart',a,{passive:true});g.appendChild(c);
            });
        }
        function rFyp(){
            let c=document.querySelector('.F');c.innerHTML='';
            fypFeeds.forEach(f=>{
                let i=document.createElement('div');i.className="C";
                i.innerHTML=`<video class="w-full h-full object-cover" loop playsinline autoplay src="${f.src}"></video>
                <div class="absolute right-3 bottom-16 flex flex-col items-center space-y-3 z-20"><div><span class="text-xl">❤️</span><p class="text-[8px] text-center">${f.L}</p></div><div><span class="text-xl">💬</span><p class="text-[8px] text-center">${f.C}</p></div></div>
                <div class="absolute left-3 bottom-4 right-12 bg-gradient-to-t from-black/80 to-transparent p-2 rounded-xl z-20"><p class="text-[10px] font-bold text-indigo-400 font-mono">${f.acct}</p><p class="text-[9px] text-gray-200 truncate font-light">${f.title}</p></div>`;
                c.appendChild(i);let v=i.querySelector('video');v.load();v.play().catch(()=>{v.muted=true;v.play();});
            });
        }
        function rLive(){
            let s=document.getElementById('live-feed-directory-scroller');s.innerHTML='';
            liveDirectory.forEach(ch=>{
                let c=document.createElement('div');c.className="bg-[#130f22]/70 border border-white/5 p-2.5 rounded-xl flex justify-between items-center cursor-pointer text-xs";
                c.innerHTML=`<p class="font-bold text-white truncate flex-1">${ch.title}</p><span class="text-[10px] text-emerald-500 ml-2">Stream ▶</span>`;
                let a=()=>{let p=document.getElementById('live-video-player');p.src=ch.src;p.load();p.play();};
                c.addEventListener('click',a);c.addEventListener('touchstart',a,{passive:true});s.appendChild(c);
            });
        }
        function saveOff(){
            if(!sel)return;let c=JSON.parse(localStorage.getItem('x10_c')||'[]');
            if(!c.some(x=>x.id===sel.id)){c.push(sel);localStorage.setItem('x10_c',JSON.stringify(c));}window.switchTab('downloads');
        }
        function rDwn(){
            let t=document.getElementById('downloads-list');t.innerHTML='';let items=JSON.parse(localStorage.getItem('x10_c')||'[]');
            if(!items.length){t.innerHTML='<div class="p-4 text-center text-xs text-gray-500 bg-[#130f22]/30 border border-white/5 rounded-xl">Storage Empty</div>';return;}
            items.forEach(m=>{
                let b=document.createElement('div');b.className="p-2 bg-[#130f22]/80 border border-white/5 rounded-xl flex flex-col space-y-2 shadow-xl";
                b.innerHTML=`<div class="flex items-center gap-3"><img src="${m.poster||''}" class="w-10 h-14 object-cover rounded-lg"><div class="flex-1 min-w-0"><p class="text-xs font-bold text-white truncate">${m.title}</p></div><button class="bg-indigo-600 font-bold text-[9px] px-2 py-1.5 rounded-lg">PLAY</button></div><video class="w-full aspect-video hidden bg-black rounded-lg mt-1" controls playsinline src="${m.video}"></video>`;
                let btn=b.querySelector('button'),vid=b.querySelector('video');
                let act=()=>{document.querySelectorAll('#downloads-list video').forEach(v=>{if(v!==vid){v.classList.add('hidden');v.pause();}});vid.classList.toggle('hidden');if(!vid.classList.contains('hidden')){vid.load();vid.play();}};
                btn.addEventListener('click',act);btn.addEventListener('touchstart',act,{passive:true});t.appendChild(b);
            });
        }
        async function getCast(id){
            let r=document.getElementById('workspace-actor-cast-row');r.innerHTML='';
            try{
                let res=await fetch(`https://api.themoviedb.org/3/movie/${id}/credits?api_key=${key}`),d=await res.json();
                d.cast.slice(0,4).forEach(a=>{
                    let img=a.profile_path?`https://image.tmdb.org/t/p/w185${a.profile_path}`:'https://via.placeholder.com/40x40';
                    let n=document.createElement('div');n.className="flex flex-col items-center flex-shrink-0 w-12 text-center";
                    n.innerHTML=`<img src="${img}" class="w-7 h-7 object-cover rounded-full"><p class="text-[7px] text-gray-400 truncate w-full mt-1">${a.name}</p>`;r.appendChild(n);
                });
            }catch(e){r.innerHTML='<p class="text-[8px] text-gray-600">No tags.</p>';}
        }
        function setupSubtitles(vid){
            vid.ontimeupdate=()=>{
                let cur=vid.currentTime,m=mockSubs.find(s=>cur>=s.start&&cur<=s.end),box=document.getElementById('subtitles-container'),t=document.getElementById('subtitles-text');
                if(m){t.innerText=m.text;box.classList.remove('hidden');}else{box.classList.add('hidden');}
            };
        }
        function executeContextSearch(){
            let q=document.getElementById('overlay-search-input').value.trim().toLowerCase(),v=document.getElementById('search-results-viewport');v.innerHTML="";if(!q)return;
            if(tab==='live'){
                let res=liveDirectory.filter(ch=>ch.title.toLowerCase().includes(q));
                res.forEach(ch=>{
                    let c=document.createElement('div');c.className="bg-[#130f22]/90 p-2 border border-white/5 rounded-xl cursor-pointer text-xs flex justify-between items-center";
                    c.innerHTML=`<p class="font-bold text-white">${ch.title}</p><span class="text-[10px] text-emerald-500 font-bold">Open ▶</span>`;
                    let a=()=>{document.getElementById('search-overlay').classList.add('hidden');ovr=false;window.switchTab('live');let p=document.getElementById('live-video-player');p.src=ch.src;p.load();p.play();};
                    c.addEventListener('click',a);c.addEventListener('touchstart',a,{passive:true});v.appendChild(c);
                });
            }else{
                fetch(`https://api.themoviedb.org/3/search/movie?api_key=${key}&query=${encodeURIComponent(q)}`).then(r=>r.json()).then(d=>{
                    if(!d.results.length)return;
                    d.results.forEach(i=>{
                        let y=i.release_date?i.release_date.split('-')[0]:'N/A',p=i.poster_path?`https://image.tmdb.org/t/p/w200${i.poster_path}`:'https://via.placeholder.com/90x135';
                        let c=document.createElement('div');c.className="flex gap-2 bg-[#130f22]/90 p-2 border border-white/5 rounded-xl cursor-pointer items-center text-xs";
                        c.innerHTML=`<img src="${p}" class="w-7 h-9 object-cover rounded"><div class="flex-1 min-w-0"><h4 class="font-bold truncate text-white">${i.title}</h4><p class="text-[8px] text-indigo-400 font-mono">${y}</p></div>`;
                        let a=()=>{sel={id:i.id,title:i.title,year:y,desc:i.overview||'No summary.',poster:p,video:"https://vjs.zencdn.net/v/oceans.mp4"};document.getElementById('search-overlay').classList.add('hidden');ovr=false;openW();};
                        c.addEventListener('click',a);c.addEventListener('touchstart',a,{passive:true});v.appendChild(c);
                    });
                }).catch(()=>{});
            }
        }
        function openW(){
            if(!sel)return;window.switchTab('workspace');
            document.getElementById('workspace-movie-desc').innerText=sel.desc;document.getElementById('workspace-preview-title').innerText=`${sel.title} (${sel.year})`;
            let p=document.getElementById('workspace-video-player');p.src=sel.video;p.load();setupSubtitles(p);p.play();getCast(sel.id);
        }
        document.addEventListener("DOMContentLoaded",()=>{
            rCat();rFyp();window.history.pushState({b:true},'');
            window.addEventListener('popstate',()=>{
                if(ovr){document.getElementById('search-overlay').classList.add('hidden');ovr=false;window.history.pushState({b:true},'');}
                else if(tab!=='home'){window.switchTab('home');window.history.pushState({b:true},'');}
                else{let t=new Date().getTime();if(t-lastB<2000){window.history.back();}else{lastB=t;window.history.pushState({b:true},'');}}
            });
            const openSearch=(title,p)=>{ovr=true;document.getElementById('search-title').innerText=title;document.getElementById('overlay-search-input').placeholder=p;document.getElementById('overlay-search-input').value='';document.getElementById('search-results-viewport').innerHTML='';document.getElementById('search-overlay').classList.remove('hidden');};
            const binds=[
                {id:'nav-home',act:()=>window.switchTab('home')},{id:'nav-live',act:()=>window.switchTab('live')},{id:'nav-downloads',act:()=>window.switchTab('downloads')},
                {id:'btn-sub-foryou',act:()=>window.switchHomeSubPage('foryou')},{id:'btn-sub-movies',act:()=>window.switchHomeSubPage('movies')},
                {id:'btn-trigger-search',act:()=>openSearch("Global Archive Query Engine","Search anything...")},
                {id:'btn-trigger-live-search',act:()=>openSearch("Search Live Feeds Only","Search...")},
                {id:'btn-close-search',act:()=>{ovr=false;document.getElementById('search-overlay').classList.add('hidden');}},
                {id:'btn-submit-search',act:()=>executeContextSearch()},
                {id:'btn-watch-now',act:()=>{let p=document.getElementById('workspace-video-player');if(sel){p.src=sel.video;p.load();setupSubtitles(p);p.play();}}},
                {id:'btn-download-now',act:()=>saveOff()},{id:'btn-clear-downloads',act:()=>{localStorage.removeItem('x10_c');rDwn();}}
            ];
            binds.forEach(b=>{let el=document.getElementById(b.id);if(el){el.addEventListener('click',b.act);el.addEventListener('touchstart',b.act,{passive:true});}});
        });
    </script>
</body>
</html>
