<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>X10 Downloader</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#00ff66">

<link rel="stylesheet" href="style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script
src="https://kit.fontawesome.com/6b5f0d4e4d.js"
crossorigin="anonymous"></script>

</head>

<body>

<!-- Splash Screen -->

<div id="splash">

<img
src="assets/logo.png"
class="splash-logo">

<h1>X10 Downloader</h1>

<p>Loading Football...</p>

</div>

<!-- App -->

<div id="app" class="hidden">

<!-- Header -->

<header>

<div class="profileButton" id="quickAI">

<i class="fas fa-user-astronaut"></i>

</div>

<div class="title">

X10 Downloader

</div>

<div class="headerButtons">

<button>

<i class="fas fa-search"></i>

</button>

<button>

<i class="fas fa-bell"></i>

</button>

</div>

</header>

<!-- Pages -->

<main id="pages">

<section id="homePage" class="page active">

</section>

<section id="sportsPage" class="page">

</section>

<section id="favoritePage" class="page">

</section>

<section id="watchPage" class="page">

</section>

<section id="accountPage" class="page">

</section>

</main>

<!-- Bottom Navigation -->

<nav>

<button
class="nav active"
data-page="homePage">

<i class="fas fa-house"></i>

<span>Home</span>

</button>

<button
class="nav"
data-page="sportsPage">

<i class="fas fa-futbol"></i>

<span>Sports</span>

</button>

<button
class="nav"
data-page="favoritePage">

<i class="fas fa-heart"></i>

<span>Favorites</span>

</button>

<button
class="nav"
data-page="watchPage">

<i class="fas fa-play-circle"></i>

<span>Watch</span>

</button>

<button
class="nav"
data-page="accountPage">

<i class="fas fa-user"></i>

<span>Account</span>

</button>

</nav>

</div>

<script src="app.js"></script>

</body>

  </html>
