<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Downloader</title>
    <link rel="icon" href="https://i.imgur.com/your_icon_id.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/your_icon_id.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100%; width: 100%; }
        
        .search-container { padding: 15px; background: #000; border-bottom: 1px solid #333; }
        .search-box { width: 100%; padding: 12px; border: 1px solid #FF00FF; background: #111; color: #fff; border-radius: 8px; }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; }
        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.3s; }
        
        .nav-bar { display: flex; justify-content: space-around; padding: 15px; border-top: 2px solid #FF00FF; background: #000; }
        .nav-btn { color: #fff; background: none; border: none; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .nav-btn.active { color: #FF00FF; border-top: 2px solid #FF00FF; padding-top: 5px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="app">
    <div class="search-container">
        <input type="text" id="search-input" class="search-box" placeholder="Search movies or creators...">
    </div>
    
    <div class="content">
        <div id="HOME" class="panel active"><h2>For You</h2><p>Swipe to view content.</p></div>
        <div id="LIVE" class="panel"><h2>Live Match</h2><p>Spain Broadcast: Second Half Live.</p></div>
        <div id="DOWNLOAD" class="panel"><h2>My Downloads</h2><p>Your saved media list is empty.</p></div>
        <div id="ACCOUNT" class="panel"><h2>Profile</h2><div id="follower-display" style="color: #FF00FF; font-size: 24px;">100,000,000 Followers</div></div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="switchPanel('HOME', this)">HOME</button>
        <button class="nav-btn" onclick="switchPanel('LIVE', this)">LIVE</button>
        <button class="nav-btn" onclick="switchPanel('DOWNLOAD', this)">DOWNLOAD</button>
        <button class="nav-btn" onclick="switchPanel('ACCOUNT', this)">ACCOUNT</button>
    </nav>
</div>

<script>
    const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
    const ADMIN_UID = "PASTE_YOUR_ACTUAL_ID_HERE";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function switchPanel(id, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    supabase.auth.getUser().then(({ data: { user } }) => {
        if (user && user.id === ADMIN_UID) {
            document.getElementById('follower-display').innerText = "100,000,000 Followers";
        }
    });
</script>
</body>
</html>
