<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>X10 Movies</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white m-0 p-0 h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;
    const supabase = createClient("https://gkfivuvtpfetzatz.supabase.co", "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE");

    const X10MovieApp = () => {
      const [movies, setMovies] = useState([]);
      const [search, setSearch] = useState('');

      // Fetch movies from Supabase (Ensure your table is named 'movies')
      useEffect(() => {
        const fetchMovies = async () => {
          const { data, error } = await supabase.from('movies').select('*');
          if (data) setMovies(data);
        };
        fetchMovies();
      }, []);

      const filteredMovies = movies.filter(m => 
        m.title.toLowerCase().includes(search.toLowerCase())
      );

      return (
        <div className="flex flex-col h-full">
          {/* Top Search Bar */}
          <div className="p-4 bg-[#111111]">
            <input 
              type="text" 
              placeholder="Search movies..." 
              className="w-full bg-[#222222] p-3 rounded-xl text-white outline-none"
              onChange={(e) => setSearch(e.target.value)}
            />
          </div>

          {/* Scrollable Movie Grid */}
          <main className="flex-1 overflow-y-auto p-4 grid grid-cols-2 gap-4">
            {filteredMovies.map(movie => (
              <div key={movie.id} className="bg-[#111111] p-2 rounded-xl">
                <video 
                  className="w-full rounded-lg mb-2" 
                  controls 
                  playsInline 
                  preload="metadata"
                >
                  <source src={movie.video_url} type="video/mp4" />
                </video>
                <h2 className="text-sm font-bold truncate">{movie.title}</h2>
              </div>
            ))}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<X10MovieApp />);
  </script>
</body>
</html>
