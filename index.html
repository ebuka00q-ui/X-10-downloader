<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08100b">
  <meta name="description" content="Vic-sound music PWA">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style-3.css">
  <title>Vic-sound</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="app-mark" aria-label="Vic-sound icon placeholder"></div>
    <div class="top-actions">
      <button id="searchToggle" class="icon-button home-only" aria-label="Search">⌕</button>
      <button id="bellButton" class="icon-button" aria-label="Notifications">♢<span id="notificationDot" class="notification-dot hidden"></span></button>
    </div>
  </header>

  <main id="main">
    <section id="homeView" class="view active">
      <div id="searchBox" class="search-box hidden">
        <input id="searchInput" type="search" placeholder="Search music..." autocomplete="off">
      </div>
      <div class="offline-bar"><span>＋</span><strong>Offline</strong><span id="songCount">0 sounds</span></div>
      <div id="categories" class="categories">
        <button class="category active" data-category="all">All</button>
        <button class="category" data-category="rap">Rap</button>
        <button class="category" data-category="pop">Pop</button>
        <button class="category" data-category="hip-hop">Hip-hop</button>
        <button class="category" data-category="trap">Trap</button>
        <button class="category" data-category="calm">Calm</button>
        <button class="category" data-category="sad">Sad</button>
        <button class="category" data-category="moody">Moody</button>
        <button class="category" data-category="love">Love</button>
        <button class="category" data-category="new">New</button>
      </div>
      <div id="homeSongs" class="song-list"></div>
    </section>

    <section id="favoritesView" class="view">
      <div id="djPanel" class="dj-panel">
        <div id="djCover" class="dj-cover">DJ</div>
        <div class="dj-info"><span class="eyebrow">VIC-SOUND DJ</span><h2>DJ</h2><p>Your music companion</p></div>
        <button id="djPlay" class="primary-button">Play</button>
      </div>
      <div id="collections" class="collection-grid"></div>
    </section>

    <section id="latestView" class="view">
      <div id="notificationPanel" class="notification-panel hidden">
        <div><strong>New release notifications</strong><p>Notify me when new music is released.</p></div>
        <label class="switch"><input id="notificationSwitch" type="checkbox"><span class="slider"></span></label>
      </div>
      <div id="latestList" class="latest-list"></div>
    </section>
  </main>

  <div id="miniPlayer" class="mini-player hidden">
    <button id="miniCover" class="mini-cover" aria-label="Open player"></button>
    <button id="miniInfo" class="mini-info" aria-label="Open player">
      <strong id="miniTitle">Nothing playing</strong><span id="miniArtist">Vic-sound</span><span class="mini-wave">〰〰〰</span>
    </button>
    <button id="miniPrev" class="player-control" aria-label="Previous or restart">↶</button>
    <button id="miniPlay" class="player-control" aria-label="Play or pause">▶</button>
    <button id="miniNext" class="player-control" aria-label="Next">↷</button>
  </div>

  <div id="queueSheet" class="bottom-sheet hidden">
    <div class="sheet-handle"></div><div class="sheet-header"><h3>Queue</h3><button id="queueClose" class="text-button">Cancel</button></div>
    <div id="queueList" class="queue-list"></div>
    <button id="timerButton" class="timer-button">Timer</button>
  </div>

  <div id="timerSheet" class="bottom-sheet small hidden">
    <div class="sheet-handle"></div><div class="sheet-header"><h3>Sleep timer</h3><button id="timerClose" class="text-button">Cancel</button></div>
    <div id="timerOptions" class="timer-options">
      <button data-minutes="2">2 minutes</button><button data-minutes="5">5 minutes</button>
      <button data-minutes="10">10 minutes</button><button data-minutes="15">15 minutes</button>
      <button data-minutes="30">30 minutes</button><button data-minutes="60">1 hour</button>
      <button data-minutes="track">End of track</button><button data-minutes="off">Off</button>
    </div>
  </div>

  <div id="playerView" class="full-player hidden">
    <button id="playerBack" class="player-back">←</button>
    <div id="playerCover" class="player-cover"></div>
    <div class="player-meta"><span id="playerArtist">Vic-sound</span><h1 id="playerTitle">Nothing playing</h1><div id="playerWave" class="player-wave">〰〰〰〰〰〰</div></div>
    <input id="progress" class="progress" type="range" min="0" max="100" value="0">
    <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
    <div class="player-controls"><button id="playerPrev">↶</button><button id="playerPlay" class="main-play">▶</button><button id="playerNext">↷</button></div>
    <div class="player-actions"><button id="queueOpen">Queue</button><button id="playerTimer">Timer</button><button id="lyricsButton">Show lyrics</button></div>
  </div>

  <nav id="bottomNav" class="bottom-nav">
    <button class="nav-button active" data-view="homeView"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button class="nav-button" data-view="favoritesView"><span class="nav-icon">♡</span><span>Favorites</span></button>
    <button class="nav-button" data-view="latestView"><span class="nav-icon">♢</span><span>Latest</span></button>
    <span id="navWave" class="nav-wave">〰</span>
  </nav>

  <div id="notificationBackdrop" class="backdrop hidden"></div>
  <div id="toast" class="toast"></div>
  <audio id="audio" preload="metadata"></audio>
</div>
<script src="app.js"></script>
</body>
</html>
