<!DOCTYPE html>
<html>
<head>
<title>X10 DOWNLOADER</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4">
<h1 class="text-xl font-bold text-indigo-500">X10 DOWNLOADER</h1>
<div id="player-zone" class="mt-4">
<video id="v" class="w-full aspect-video bg-gray-900" controls playsinline></video>
<p id="t" class="mt-2 text-sm text-gray-400">Select a video to begin</p>
</div>
<div id="list" class="mt-6 space-y-3"></div>
<script>
const data = [
{t:'Big Buck Bunny',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'},
{t:'Sintel',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'}
];
const l = document.getElementById('list');
const v = document.getElementById('v');
const t = document.getElementById('t');
data.forEach(i => {
let b = document.createElement('button');
b.className = 'w-full p-4 bg-gray-900 rounded-lg border border-gray-700 text-left hover:border-indigo-500 transition';
b.innerHTML = '<span class="text-indigo-400">▶</span> ' + i.t;
b.onclick = () => { v.src = i.s; v.play(); t.innerText = 'Now Playing: ' + i.t; };
l.appendChild(b);
});
</script>
</body>
</html>
