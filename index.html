<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>X10 Downloader</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0f;color:#fff;height:100vh;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;background:#0a0a0f;max-width:500px;margin:0 auto;width:100%}

/* HEADER */
.hdr{padding:10px 16px 8px;background:#0a0a0f;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,255,136,0.15)}
.hdr-t{font-size:18px;font-weight:900;background:linear-gradient(135deg,#66ffaa,#00cc66);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-a{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc66);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;cursor:pointer;border:2px solid rgba(0,255,136,0.3)}

/* SUB TABS */
.stabs{display:flex;padding:8px 16px 0;gap:20px;background:#0a0a0f;border-bottom:1px solid rgba(0,255,136,0.08)}
.stab{padding:8px 4px 12px;font-size:13px;font-weight:600;color:#555;cursor:pointer;border-bottom:3px solid transparent;text-transform:uppercase}
.stab.active{color:#00ff88;border-bottom-color:#00ff88}

/* PAGES */
.cnt{flex:1;overflow:hidden;position:relative}
.page{display:none;height:100%;overflow-y:auto;padding:12px}
.page.active{display:block}

/* SPORTS CARDS */
.sport-card{background:linear-gradient(145deg,#12121a,#0d0d15);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid rgba(0,255,136,0.08)}
.sport-card .teams{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.sport-card .team{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#fff}
.sport-card .team img{width:24px;height:24px;border-radius:50%;object-fit:contain;background:#fff;padding:2px}
.sport-card .score{font-size:24px;font-weight:900;color:#00ff88}
.sport-card .status{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:12px;display:inline-block}
.status-live{color:#00ff88;border:1px solid #00ff88;animation:pulse 1.5s infinite}
.status-finished{color:#ff4444;border:1px solid #ff4444}
.status-scheduled{color:#ffaa00;border:1px solid #ffaa00}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sport-card .league{color:#66aa88;font-size:10px;margin-bottom:4px}
.sport-card .actions{display:flex;gap:10px;margin-top:6px;justify-content:center}
.sport-card .actions button{background:0;border:0;color:#888;font-size:18px;cursor:pointer;padding:2px 6px}
.sport-card .actions button:hover{color:#00ff88}

/* BOTTOM NAV */
.bnav{display:flex;justify-content:space-around;align-items:center;padding:8px 0 14px;background:rgba(10,10,15,0.97);border-top:1px solid rgba(0,255,136,0.12);flex-shrink:0;position:sticky;bottom:0;z-index:20}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#555;font-size:9px;cursor:pointer;padding:4px 12px;border:0;background:0;font-family:inherit}
.nav-item .nic{font-size:20px}
.nav-item.active{color:#00ff88}
.nav-item.active .nic{text-shadow:0 0 30px rgba(0,255,136,0.4)}

/* WATCH */
.di{display:flex;gap:8px;margin-bottom:10px}
.di input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(0,255,136,0.2);background:#12121a;color:#fff;font-size:13px;outline:0}
.di input:focus{border-color:#00ff88}
.di button{padding:10px 16px;border-radius:10px;border:0;background:linear-gradient(135deg,#00ff88,#00cc66);color:#0a0a0f;font-weight:700;cursor:pointer;font-size:13px}
.player-box{width:100%;border-radius:10px;margin-top:8px;background:#0d0d15;border:1px solid rgba(0,255,136,0.1);overflow:hidden;min-height:250px;display:flex;align-items:center;justify-content:center;position:relative}
.player-box video,.player-box iframe,.player-box img{width:100%;border:none;border-radius:8px;display:block;max-height:400px;background:#000}
.player-box iframe{height:350px}
.fs-btn{position:absolute;bottom:70px;right:10px;background:rgba(0,0,0,0.7);border:1px solid rgba(0,255,136,0.3);border-radius:50%;width:36px;height:36px;color:#00ff88;font-size:16px;cursor:pointer;z-index:10}
.dl-btn{position:absolute;bottom:20px;right:10px;background:rgba(0,0,0,0.7);border:1px solid rgba(0,255,136,0.3);border-radius:50%;width:36px;height:36px;color:#00ff88;font-size:14px;cursor:pointer;z-index:10}

/* HISTORY */
.history-item{background:#12121a;padding:8px 12px;border-radius:8px;border:1px solid rgba(0,255,136,0.08);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.history-item .h-link{color:#66ffaa;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
.history-item .h-play{color:#00ff88;cursor:pointer;padding:2px 6px;border:1px solid rgba(0,255,136,0.2);border-radius:4px;font-size:10px;margin-right:4px}
.history-item .h-delete{color:#ff4444;cursor:pointer;padding:2px 6px;border:0;background:0;font-size:14px}

/* ACCOUNT */
.ph{text-align:center;padding:12px 0}
.pa{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc66);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#0a0a0f;border:3px solid rgba(0,255,136,0.25);cursor:pointer;overflow:hidden}
.pa img{width:100%;height:100%;object-fit:cover}
.pn{font-size:17px;font-weight:700;color:#66ffaa}
.pn input{background:#12121a;border:1px solid rgba(0,255,136,0.2);border-radius:6px;padding:4px 10px;color:#66ffaa;font-size:15px;font-weight:700;text-align:center;outline:0;width:180px}
.ps{display:flex;justify-content:center;gap:16px;margin:10px 0}
.ps .n{font-size:15px;font-weight:700;color:#00ff88}
.ps .lbl{font-size:9px;color:#66aa88;text-transform:uppercase}
.cd{background:linear-gradient(145deg,#0a1a0f,#05100a);border-radius:12px;padding:12px;margin-top:10px;border:2px solid rgba(0,255,136,0.1)}
.cd h3{color:#66ffaa;font-size:12px;margin-bottom:8px;text-transform:uppercase}
.cd .sr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.cd .sr:last-child{border-bottom:0}
.cd .sl{color:#66aa88;font-size:12px}
.cd .sv{color:#00ff88;font-weight:700;font-size:12px}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div id=app>

<!-- HEADER -->
<div class=hdr>
<span class=hdr-t>⬇️ X10</span>
<div class=hdr-a id=hAcct>👤</div>
</div>

<!-- SUB TABS -->
<div class=stabs id=stabs>
<span class="stab active" data-gender=male>MEN</span>
<span class=stab data-gender=female>WOMEN</span>
</div>

<!-- CONTENT -->
<div class=cnt>
<div class="page active" id=pg-home><div id=sL><p style=color:#555;font-size:13px;text-align:center;padding:40px 0;>⚽ Loading...</p></div></div>
<div class=page id=pg-fav><h2 style=color:#66ffaa;font-size:15px;>⭐ Favorites</h2><div id=favList><p style=color:#555;font-size:13px;text-align:center;padding:20px;>No favorites</p></div></div>
<div class=page id=pg-watch><h2 style=color:#66ffaa;font-size:15px;>▶️ Watch</h2><div class=di><input type=text placeholder="Paste any link..." id=vLink><button onclick=playVideo()>▶</button></div><div class=player-box id=pBox><div style=color:#555;font-size:13px;text-align:center;padding:20px;>⬇️ Paste a link</div></div><div style=display:flex;justify-content:space-between;margin-top:12px;><h3 style=color:#66ffaa;font-size:13px;>📜 History</h3><button onclick=clearAll() style=color:#ff4444;background:0;border:0;font-size:11px;cursor:pointer;>Clear</button></div><div id=hList></div></div>
<div class=page id=pg-acct><div class=ph><div class=pa id=pAv onclick=uploadPhoto()>👤</div><div class=pn><input type=text id=uName value=Creator maxlength=20 onchange=saveName()></div><div style=color:#66aa88;font-size:11px; id=pId>@x10_creator</div></div><div class=ps><div><div class=n id=fCount>100M</div><div class=lbl>Followers</div></div><div><div class=n id=pCount>47</div><div class=lbl>Posts</div></div><div><div class=n id=rCount>12</div><div class=lbl>Reposts</div></div></div><div class=cd><h3>📊 Dashboard</h3><div class=sr><span class=sl>Users</span><span class=sv id=tUsers>1</span></div><div class=sr><span class=sl>Posts</span><span class=sv id=tPosts>47</span></div></div></div>
</div>

<!-- BOTTOM NAV -->
<div class=bnav>
<div class="nav-item active" data-tab=home onclick="switchPage('home')"><span class=nic>⚽</span>Home</div>
<div class=nav-item data-tab=fav onclick="switchPage('fav')"><span class=nic>⭐</span>Favs</div>
<div class=nav-item data-tab=watch onclick="switchPage('watch')"><span class=nic>▶️</span>Watch</div>
<div class=nav-item data-tab=acct onclick="switchPage('acct')"><span class=nic>👤</span>Account</div>
</div>
</div>

<script>
// =============================================
// CONFIG
// =============================================
const SPORTS_KEY = "88c0b86bf9baffb1fdd993c275efd6a5";
const VERSION = "3.0.2";
const storedVer = localStorage.getItem('x10_version');
if (storedVer && storedVer !== VERSION) {
    alert("📢 Update!");
    localStorage.setItem('x10_version', VERSION);
    location.reload();
} else if (!storedVer) {
    localStorage.setItem('x10_version', VERSION);
}
console.log("✅ Version:", VERSION);

// =============================================
// STATE
// =============================================
let favorites = JSON.parse(localStorage.getItem('x10_favorites') || '[]');
let currentLink = '';
let refreshInterval = null;

// =============================================
// NAVIGATION - FIXED
// =============================================
function switchPage(tab) {
    console.log("➡️ Switching to:", tab);
    
    // Update nav
    document.querySelectorAll('.nav-item').forEach(function(n) {
        n.classList.remove('active');
        if (n.dataset.tab === tab) {
            n.classList.add('active');
        }
    });
    
    // Show page
    document.querySelectorAll('.page').forEach(function(p) {
        p.classList.remove('active');
    });
    var target = document.getElementById('pg-' + tab);
    if (target) target.classList.add('active');
    
    // Show/hide sub-tabs
    var stabs = document.getElementById('stabs');
    stabs.style.display = (tab === 'home') ? 'flex' : 'none';
    
    // Load data
    if (tab === 'home') fetchSports();
    if (tab === 'fav') renderFavorites();
}

// =============================================
// HEADER ACCOUNT CLICK
// =============================================
document.getElementById('hAcct').addEventListener('click', function() {
    switchPage('acct');
});

// =============================================
// GENDER TOGGLE
// =============================================
document.querySelectorAll('.stab').forEach(function(tab) {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.stab').forEach(function(t) {
            t.classList.remove('active');
        });
        this.classList.add('active');
        fetchSports();
    });
});

// =============================================
// SPORTS - FETCH
// =============================================
function fetchSports() {
    var el = document.getElementById('sL');
    el.innerHTML = '<p style=color:#555;font-size:13px;text-align:center;padding:20px;>⚽ Loading...</p>';
    
    var d = new Date();
    var ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    
    fetch('https://v3.football.api-sports.io/fixtures?date=' + ds, {
        headers: {
            'x-rapidapi-key': SPORTS_KEY,
            'x-rapidapi-host': 'v3.football.api-sports.io'
        }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!data.response || data.response.length === 0) {
            el.innerHTML = '<p style=color:#555;font-size:13px;text-align:center;padding:20px;>⚽ No matches today</p>';
            return;
        }
        renderMatches(data.response);
    })
    .catch(function() {
        el.innerHTML = '<p style=color:#ff4444;font-size:13px;text-align:center;padding:20px;>⚠️ API Error - Check Key</p>';
    });
}

function renderMatches(matches) {
    var el = document.getElementById('sL');
    var html = '';
    
    // Sort: LIVE first, then Finished, then Scheduled
    matches.sort(function(a, b) {
        var order = {LIVE:0, '1H':0, '2H':0, HT:0, ET:0, P:0, FT:1, AET:1, PEN:1, NS:2};
        var sa = a.fixture.status.short || 'NS';
        var sb = b.fixture.status.short || 'NS';
        return (order[sa] || 2) - (order[sb] || 2);
    });
    
    matches.forEach(function(m) {
        var s = m.fixture.status.short;
        var sc = 'status-scheduled';
        var st = '⏰ Scheduled';
        
        if (s === 'FT' || s === 'AET' || s === 'PEN') {
            sc = 'status-finished';
            st = '✅ Finished';
        } else if (s === '1H' || s === 'HT' || s === '2H' || s === 'ET' || s === 'P' || s === 'LIVE') {
            sc = 'status-live';
            st = '🔴 LIVE';
        }
        
        var hl = m.teams.home.logo || '';
        var al = m.teams.away.logo || '';
        var homeId = m.teams.home.id;
        var awayId = m.teams.away.id;
        
        var homeFav = favorites.some(function(f) { return f.id === homeId; });
        var awayFav = favorites.some(function(f) { return f.id === awayId; });
        
        html += '<div class=sport-card>';
        html += '<div class=league>🏆 ' + m.league.name + '</div>';
        html += '<div class=teams>';
        html += '<div class=team>' + (hl ? '<img src="'+hl+'">' : '') + '<span>' + m.teams.home.name + '</span></div>';
        html += '<div class=score>' + (m.goals.home||0) + '-' + (m.goals.away||0) + '</div>';
        html += '<div class=team>' + (al ? '<img src="'+al+'">' : '') + '<span>' + m.teams.away.name + '</span></div>';
        html += '</div>';
        html += '<div style=display:flex;justify-content:space-between;margin-top:4px;>';
        html += '<span class=status style="'+sc+'">'+st+'</span>';
        html += '<span style=color:#555;font-size:10px;>' + (m.fixture.date ? new Date(m.fixture.date).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) : '') + '</span>';
        html += '</div>';
        html += '<div class=actions>';
        html += '<button onclick="toggleFavorite('+homeId+',\''+m.teams.home.name+'\',\''+hl+'\')" title="Star '+m.teams.home.name+'">' + (homeFav ? '⭐' : '☆') + '</button>';
        html += '<button onclick="toggleFavorite('+awayId+',\''+m.teams.away.name+'\',\''+al+'\')" title="Star '+m.teams.away.name+'">' + (awayFav ? '⭐' : '☆') + '</button>';
        html += '<button onclick="alert(\'🔔 Alerts set for '+m.teams.home.name+' vs '+m.teams.away.name+'\')" title="Get alerts">🔔</button>';
        html += '<button onclick="openMatchDetail('+m.fixture.id+')" title="Match details">📊</button>';
        html += '</div>';
        html += '</div>';
    });
    
    el.innerHTML = html;
}

// =============================================
// AUTO REFRESH - EVERY 30 SECONDS
// =============================================
if (refreshInterval) clearInterval(refreshInterval);
refreshInterval = setInterval(fetchSports, 30000);

// =============================================
// MATCH DETAIL
// =============================================
function openMatchDetail(id) {
    var el = document.getElementById('sL');
    el.innerHTML = '<p style=color:#555;font-size:13px;text-align:center;padding:20px;>📊 Loading...</p>';
    
    fetch('https://v3.football.api-sports.io/fixtures?id=' + id, {
        headers: {
            'x-rapidapi-key': SPORTS_KEY,
            'x-rapidapi-host': 'v3.football.api-sports.io'
        }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.response && data.response[0]) {
            var m = data.response[0];
            var html = '<div class=sport-card style=border-color:#00ff88;>';
            html += '<div class=league>🏆 ' + m.league.name + '</div>';
            html += '<div class=teams>';
            html += '<div class=team>' + (m.teams.home.logo ? '<img src="'+m.teams.home.logo+'">' : '') + '<span style=font-size:16px;>'+m.teams.home.name+'</span></div>';
            html += '<div class=score style=font-size:32px;>' + (m.goals.home||0) + '-' + (m.goals.away||0) + '</div>';
            html += '<div class=team>' + (m.teams.away.logo ? '<img src="'+m.teams.away.logo+'">' : '') + '<span style=font-size:16px;>'+m.teams.away.name+'</span></div>';
            html += '</div>';
            html += '<div style=text-align:center;margin:6px 0;>';
            var st = (m.fixture.status.short === 'FT' || m.fixture.status.short === 'AET') ? '✅ Finished' : '🔴 LIVE';
            html += '<span class=status style="' + ((m.fixture.status.short === 'FT' || m.fixture.status.short === 'AET') ? 'status-finished' : 'status-live') + '">' + st + '</span>';
            html += '</div>';
            
            if (m.events && m.events.length) {
                html += '<div style=margin-top:10px;><h4 style=color:#66ffaa;font-size:13px;>⚡ Events</h4>';
                m.events.forEach(function(e) {
                    var name = e.player.name || 'Unknown';
                    html += '<div style=display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.05);>';
                    html += '<span style=color:#66aa88;>' + (e.time.elapsed || '') + '\'</span>';
                    html += '<span style=color:#fff;>' + e.type + ' - ' + name + '</span>';
                    html += '</div>';
                });
                html += '</div>';
            }
            
            html += '<button onclick=fetchSports() style=margin-top:12px;padding:8px 16px;border-radius:8px;border:0;background:linear-gradient(135deg,#00ff88,#00cc66);color:#0a0a0f;font-weight:700;cursor:pointer;>⬅ Back</button>';
            html += '</div>';
            el.innerHTML = html;
        }
    })
    .catch(function() {
        el.innerHTML = '<p style=color:#ff4444;font-size:13px;text-align:center;padding:20px;>⚠️ Error</p>';
    });
}

// =============================================
// FAVORITES
// =============================================
function toggleFavorite(id, name, logo) {
    var idx = favorites.findIndex(function(f) { return f.id === id; });
    if (idx > -1) {
        favorites.splice(idx, 1);
    } else {
        favorites.push({id: id, name: name, logo: logo});
    }
    localStorage.setItem('x10_favorites', JSON.stringify(favorites));
    fetchSports();
    renderFavorites();
}

function renderFavorites() {
    var list = document.getElementById('favList');
    if (favorites.length === 0) {
        list.innerHTML = '<p style=color:#555;font-size:13px;text-align:center;padding:20px;>⭐ No favorites</p>';
        return;
    }
    var html = '';
    favorites.forEach(function(f) {
        html += '<div class=sport-card style=border-color:rgba(255,204,0,0.3);>';
        html += '<div class=teams><div class=team>' + (f.logo ? '<img src="'+f.logo+'">' : '') + '<span style=color:#ffcc00;>'+f.name+'</span></div><div style=color:#ffcc00;font-size:20px;>⭐</div></div>';
        html += '</div>';
    });
    list.innerHTML = html;
}

// =============================================
// VIDEO PLAYER - ANY LINK
// =============================================
function playVideo() {
    var link = document.getElementById('vLink').value.trim();
    var container = document.getElementById('pBox');
    
    if (!link) {
        alert('Please paste a link');
        return;
    }
    
    currentLink = link;
    container.innerHTML = '';
    saveHistory(link)
