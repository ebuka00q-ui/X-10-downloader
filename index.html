<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10 Downloader</title>
    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .nav-bar { display: flex; justify-content: space-around; padding: 15px; border-top: 2px solid #FF00FF; background: #000; position: fixed; bottom: 0; width: 100%; }
        .panel { display: none; height: 90vh; }
        .panel.active { display: flex; justify-content: center; align-items: center; }
        .admin-stat { color: #FF00FF; font-weight: bold; font-size: 24px; }
        .red-dot { width: 10px; height: 10px; background: red; border-radius: 50%; position: absolute; }
    </style>
</head>
<body>

<div id="app">
    <!-- Panels -->
    <div id="HOME" class="panel active">HOME FEED</div>
    <div id="LIVE" class="panel">LIVE MATCH FEED</div>
    <div id="DOWNLOAD" class="panel">DOWNLOADS</div>
    <div id="ACCOUNT" class="panel">
        <div id="follower-display" class="admin-stat">100,000,000 Followers</div>
    </div>

    <!-- Nav Bar -->
    <nav class="nav-bar">
        <button onclick="switchPanel('HOME')">HOME</button>
        <button onclick="switchPanel('LIVE')">LIVE</button>
        <button onclick="switchPanel('DOWNLOAD')">DOWNLOAD</button>
        <button onclick="switchPanel('ACCOUNT')">ACCOUNT</button>
    </nav>
</div>

<script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_UID = "YOUR_SPECIFIC_ADMIN_ID"; // Paste your ID here
    const MONETIZATION_ACTIVE = false;

    // --- PANEL SWITCHING ENGINE ---
    function switchPanel(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // --- AUTHORITY & FILTER LOGIC ---
    async function initApp() {
        const { data: { user } } = await supabase.auth.getUser();
        // 100M Authority Check
        if (user && user.id === ADMIN_UID) {
            document.getElementById('follower-display').innerText = "100,000,000 Followers";
        }
    }
    
    // SAFE FEED: Automatically excludes 'ADULT' category
    async function fetchSafeFeed() {
        const { data } = await supabase.from('videos').select('*').neq('category', 'ADULT');
    }

    initApp();
</script>
</body>
</html>
