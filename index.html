<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkV4dGVuZCBEb3dubG9hZGVyIiwKICAic2hvcnRfbmFtZSI6ICJYMTAiLAogICxlcm9yIjogIm1hbmlmZXN0X3ZhbGlkIiwgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGEwYTBhIiwKICAidGhlbWVfY29sb3IiOiAiI2ZmMDA3ZiIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImRhdGE6aW1hZ2Uvc3ZnK3htbDtiYXNlNjQsUEhOMlp5QmtZV05yZHhObFBXTnZiRzl5WldSMWJtVnlQV1JtYVc1cGVXVWdNutNuIiwKICAiZXJyb3IiOiAibWFuaWZlc3RfdmFsaWQiCiAgICB9CiAgXQp9">
</head>
<body>

    <div id="view-container">
        <div id="view-home" class="main-view active-view">
            <div class="search-header">
                <div id="dynamic-trigger-box" class="search-box-trigger" onclick="openSearchOverlay()">🔍 Search FYP content...</div>
            </div>
            <div class="slide-nav">
                <div id="tab-fyp" class="slide-tab active-slide" onclick="slidePage(0)">For You Page</div>
                <div id="tab-movies" class="slide-tab" onclick="slidePage(1)">Movies</div>
            </div>
            
            <div class="slider-viewport" id="swipe-zone">
                <div id="home-slider">
                    <div class="slide-page" id="page-fyp"></div>
                    
                    <div class="slide-page" id="page-movies">
                        <div class="scrollable-content" style="padding: 0;">
                            <h3 style="margin-top:0; color:#ff007f; text-align: left;" id="rolling-date-header">Latest Movies</h3>
                            <div class="card-grid">
                                <div class="movie-card" onclick="openMovieDetail('Quantum Drift', '2026', 'Sarah Jenkins, Marcus Vance', 'Timeline fractures.')">
                                    <div class="poster-placeholder">🌀</div>
                                    <strong>Quantum Drift</strong>
                                    <div style="font-size:0.85em; color:#aaa; margin-top:4px;">2026</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-live" class="main-view">
            <div class="search-header"><div class="search-box-trigger" onclick="openSearchOverlay()">🔍 Search Live...</div></div>
            <div class="scrollable-content">
                <h2>Active Live Feeds</h2>
                <div class="video-box" style="border: 1px solid #ff007f;">⚽ Live Football Broadcast</div>
            </div>
        </div>

        <div id="view-download" class="main-view">
            <div class="scrollable-content">
                <h2>Downloads Terminal</h2>
                <div id="active-dl-bar" style="color:#555; padding: 10px 0;">No active tracks processing.</div>
            </div>
        </div>

        <div id="view-profile" class="main-view">
            <div class="scrollable-content">
                <h2>Create Your Account</h2>
                <div class="auth-container">
                    <button class="auth-btn google-btn" onclick="executeServerAuth('Google')">Continue with Google</button>
                    <button class="auth-btn apple-btn" onclick="executeServerAuth('Apple')">Continue with Apple</button>
                </div>
            </div>
        </div>

        <div id="view-details" class="main-view" style="background:#050505;">
            <div class="search-header"><button onclick="closeMovieDetail()" style="background:none; border:none; color:white; font-family:inherit;">← Back</button></div>
            <div class="scrollable-content">
                <div class="video-box">▶ Trailer Player</div>
                <h2 id="details-title"></h2>
                <p id="details-cast" style="color:#ff007f; font-weight:bold;"></p>
                <p id="details-story" style="color:#ccc;"></p>
            </div>
            <div class="details-action-row">
                <button class="split-action-btn watch-btn" onclick="alert('Streaming continuous video stream matrix...')">▶ Watch</button>
            </div>
        </div>
    </div>

    <div id="search-overlay">
        <div class="search-header">
            <input type="text" id="main-search-input" class="search-bar-input" onkeyup="if(event.key === 'Enter') runSearchLogic()">
            <button class="search-btn-action" onclick="runSearchLogic()">Search</button>
            <button onclick="closeSearchOverlay()" style="background:none; border:none; color:white; font-family:inherit;">Cancel</button>
        </div>
    </div>

    <nav>
        <div id="nav-home" class="nav-btn active-tab" onclick="switchSection('home')"><div>🏠</div><span>Home</span></div>
        <div id="nav-live" class="nav-btn" onclick="switchSection('live')"><div>📡</div><span>Live</span></div>
        <div id="nav-download" class="nav-btn" onclick="switchSection('download')"><div>📥</div><span>Downloads</span></div>
        <div id="nav-profile" class="nav-btn" onclick="switchSection('profile')"><div>👤</div><span>Account</span></div>
    </nav>

    <script src="app.js"></script>
</body>
        </html>
