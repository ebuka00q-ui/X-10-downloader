<!DOCTYPE html>
<html lang="en" style="height: 100%; width: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Modern Dark Gradient Theme */
        body { margin: 0; background: linear-gradient(135deg, #0a0a0a 0%, #1a0b2e 100%); color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Tactical Feedback Styles */
        .nav-btn { color: #888; transition: 0.3s; cursor: pointer; padding: 15px; font-weight: bold; }
        .nav-btn.active { color: #ff007f; text-shadow: 0 0 10px #ff007f; border-top: 2px solid #ff007f; }
        
        #view-container { flex: 1; overflow-y: auto; padding: 20px; }
        .search-trigger { background: #1f1f1f; padding: 15px; border-radius: 12px; border: 1px solid #444; margin-bottom: 20px; color: #aaa; }
        
        nav { background: #000; display: flex; justify-content: space-around; border-top: 1px solid #333; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="view-container">
        <div id="home-view" class="view">
            <div class="search-trigger" onclick="alert('Search Active')">Search movies, shows, links...</div>
            <div id="feed-content">
                <h2 style="color: #fff;">Trending Now (2026)</h2>
                <p>Content will populate here from your server.</p>
                <div style="height: 200px; background: #222; border-radius: 10px; margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-btn active" onclick="switchTab(this, 'home')">Home</div>
        <div class="nav-btn" onclick="switchTab(this, 'live')">Live</div>
        <div class="nav-btn" onclick="switchTab(this, 'downloads')">Downloads</div>
    </nav>

    <script>
        function switchTab(el, tabId) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            console.log("Tab switched to: " + tabId);
        }
    </script>
</body>
</html>
