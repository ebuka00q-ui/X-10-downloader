<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10</title><script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:linear-gradient(-45deg,#0b0813,#1a0b2e,#0d1b3e,#14051c);background-size:400% 400%;animation:L 8s infinite;color:#fff;font-family:sans-serif}
        @keyframes L{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
        .P{display:none}.P.active{display:block}
        .S{display:none}.S.active{display:block}
        .movie-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:10px;}
        .cube-img{aspect-ratio:1/1; width:100%; object-fit:cover; border-radius:10px; background:#1e1b4b;}
        .tab-btn.active{border-bottom:2px solid #6366f1; color:#fff;}
        .nav-btn.active{color:#818cf8; font-weight:bold;}
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20 select-none">

    <div id="search-overlay" class="hidden fixed inset-0 bg-[#0b0813]/95 z-50 p-4">
        <div class="max-w-md mx-auto pt-10 space-y-4">
            <h2 class="text-xs font-bold text-indigo-400">SEARCH DATABASE</h2>
            <div class="flex gap-2">
                <input id="search-input" type="text" class="flex-1 bg-[#130f22] p-2 rounded text-xs text-white border border-gray-700" placeholder="Enter movie title...">
                <button onclick="executeSearch()" class="bg-indigo-600 px-4 rounded text-xs font-bold hover:bg-indigo-500">SEARCH</button>
            </div>
            <button onclick="document.getElementById('search-overlay').classList.add('hidden')" class="text-[10px] text-gray-500 underline">Close Search</button>
            
            <div id="search-results" class="grid grid-cols-3 gap-2 pt-4"></div>
        </div>
    </div>

    <main class="flex-1 max-w-md mx-auto w-full p-4 space-y-4">
        <div id="page-home" class="P active">
            <div class="flex justify-between items-center bg-[#130f22]/60 p-4 rounded-2xl mb-4 border border-white/5">
                <h1 class="text-sm font-black text-indigo-400">X10 DOWNLOADER</h1>
                <button onclick="document.getElementById('search-overlay').classList.remove('hidden')" class="bg-indigo-500/20 text-xs px-3 py-1 rounded-xl text-indigo-400 border border-indigo-500/30">🔍 Search</button>
            </div>
            <div class="flex text-center text-xs font-bold border-b border-white/5 mb-4">
                <button id="btn-sub-foryou" class="tab-btn active flex-1 pb-2 border-b-2 border-transparent text-gray-400">For You</button>
                <button id="btn-sub-movies" class="tab-btn flex-1 pb-2 border-b-2 border-transparent text-gray-400">Movies</button>
            </div>
            <div id="sub-foryou" class="S active"><p class="text-center text-gray-500 py-10">Waiting for data connection...</p></div>
            <div id="sub-movies" class="S"><div class="movie-grid" id="movie-gallery"></div></div>
        </div>
    </main>

    <script>
        // Search Simulation
        function executeSearch(){
            const container = document.getElementById('search-results');
            const query = document.getElementById('search-input').value;
            
            if(!query) return;

            // Show loading state
            container.innerHTML = `<p class="text-xs text-indigo-400 col-span-3">Searching for "${query}"...</p>`;
            
            // Simulate server delay (connection)
            setTimeout(() => {
                container.innerHTML = Array(3).fill(0).map(() => `
                    <div class="text-center">
                        <div class="cube-img"></div>
                        <p class="text-[9px] mt-1 text-white">Result Title</p>
                    </div>
                `).join('');
            }, 800);
        }

        // Sub-Tab Switcher logic
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
            tab.onclick = () => {
                tabs.forEach(t => t.classList.remove('active', 'text-white'));
                tab.classList.add('active', 'text-white');
                document.querySelectorAll('.S').forEach(s => s.classList.remove('active'));
                if(tab.id === 'btn-sub-movies') {
                    document.getElementById('sub-movies').classList.add('active');
                    renderMovies();
                } else {
                    document.getElementById('sub-foryou').classList.add('active');
                }
            };
        });

        function renderMovies(){
            const g = document.getElementById('movie-gallery');
            g.innerHTML = Array(9).fill(0).map(() => `
                <div class="text-center">
                    <div class="cube-img"></div>
                    <p class="text-[9px] mt-1 text-white">Movie</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
