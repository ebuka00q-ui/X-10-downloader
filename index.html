<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X10 DOWNLOADER</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4">

<h1 class="text-xl font-bold text-indigo-500 mb-4">X10 DOWNLOADER</h1>

<div class="bg-gray-900 p-2 rounded-lg">
<video id="v" class="w-full aspect-video" controls playsinline></video>
<p id="t" class="mt-2 text-xs text-gray-400">Ready</p>
</div>

<div class="flex gap-2 mt-6 mb-4">
<button onclick="show('fyp')" class="bg-gray-800 p-2 rounded text-xs">FYP</button>
<button onclick="show('live')" class="bg-gray-800 p-2 rounded text-xs">LIVE</button>
<button onclick="show('dwn')" class="bg-gray-800 p-2 rounded text-xs">DWN</button>
</div>

<div id="content" class="space-y-3"></div>

<script>
const data = {
fyp: [
{t:'Big Buck Bunny',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'},
{t:'Sintel',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'}
],
live: [
{t:'Live Relay A',s:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'}
],
dwn: []
};

const v = document.getElementById('v');
const t = document.getElementById('t');
const c = document.getElementById('content');

function show(type) {
c.innerHTML = '';
data[type].forEach(i => {
let b = document.createElement('button');
b.className = 'w-full p-4 bg-gray-900 border border-gray-700 rounded text-left text-xs';
b.innerHTML = '▶ ' + i.t;
b.onclick = () => { v.src = i.s; v.play(); t.innerText = i.t; };
c.appendChild(b);
});
}
// Init
show('fyp');
</script>
</body>
</html>
