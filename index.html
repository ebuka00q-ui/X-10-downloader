<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Downloader</title>
    <style>
        :root { --neon-pink: #ff00ff; --deep-black: #000000; }
        body, html { margin: 0; padding: 0; background: var(--deep-black); color: #fff; font-family: sans-serif; height: 100%; overflow: hidden; }
        
        /* Each panel is full screen */
        .panel { display: none; height: 100%; width: 100%; position: absolute; top: 0; left: 0; padding-top: 70px; padding-bottom: 70px; }
        .panel.active { display: block; }
        
        /* Navigation & Search */
        #search-container { position: fixed; top: 0; width: 100%; padding: 10px; background: #000; z-index: 50; display: flex; }
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-btn { background: none; border: none; color: #888; cursor: pointer; padding: 10px; }
        .nav-btn.active { color: var(--neon-pink); font-weight: bold; }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Search..." style="flex:1; padding:8px;">
        <button onclick="alert('Search: ' + document.getElementById('search-input').value)">Go</button>
    </div>

    <div id="home-panel" class="panel active"><h2>For You</h2></div>
    <div id="movie-panel" class="panel"><h2>Movie Section</h2></div>
    <div id="live-panel" class="panel"><h2>Live Streams</h2></div>
    <div id="account-panel" class="panel"><h2>Account</h2></div>

    <nav>
        <button class="nav-btn active" onclick="switchPanel('home-panel', this)">Home</button>
        <button class="nav-btn" onclick="switchPanel('movie-panel', this)">Movie</button>
        <button class="nav-btn" onclick="switchPanel('live-panel', this)">Live</button>
        <button class="nav-btn" onclick="switchPanel('account-panel', this)">Account</button>
    </nav>

    <script>
        function switchPanel(id, btn) {
            // Hide all panels
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            // Remove active style from all buttons
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            // Show requested panel
            document.getElementById(id).classList.add('active');
            // Style requested button
            btn.classList.add('active');
        }
    </script>
</body>
</html>
