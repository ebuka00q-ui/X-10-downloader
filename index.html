<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Downloader</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-pink: #ff00ff; --deep-black: #000000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: var(--deep-black); color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* Panels */
        .panel { display: none; width: 100%; height: 100%; padding-top: 60px; overflow-y: auto; }
        .panel.active { display: block; }
        
        /* Search Bar */
        #search-container { position: fixed; top: 0; width: 100%; padding: 10px; background: #000; z-index: 50; display: flex; gap: 5px; }
        input { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; }
        #search-go { background: var(--neon-pink); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }

        /* Nav */
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-btn { background: none; border: none; color: #888; font-size: 13px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: var(--neon-pink); }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Search...">
        <button id="search-go" onclick="performSearch()">Search</button>
    </div>

    <div id="home-panel" class="panel active"><h2>For You Feed</h2></div>
    <div id="movie-panel" class="panel"><h2>Movie Section</h2></div>
    <div id="live-panel" class="panel"><h2>Live Streams</h2></div>
    <div id="account-panel" class="panel"><h2>Account</h2></div>

    <nav>
        <button class="nav-btn active" onclick="switchPanel('home-panel', this)">Home</button>
        <button class="nav-btn" onclick="switchPanel('movie-panel', this)">Movie</button>
        <button class="nav-btn" onclick="switchPanel('live-panel', this)">Live</button>
        <button class="nav-btn" onclick="switchPanel('account-panel', this)">Account</button>
    </nav>

    <script>
        const supabase = Supabase.createClient("https://gkfivuvtpfetzatz.supabase.co", "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE");

        function switchPanel(id, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function performSearch() {
            alert("Search active for: " + document.getElementById('search-input').value);
        }
    </script>
</body>
</html>
