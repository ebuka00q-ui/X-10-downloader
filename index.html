<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X10 Global Engine</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-pink: #ff00ff; --bg-black: #000000; --text-grey: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-black); color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; width: 100vw; }
        
        .panel { display: none; height: 100vh; padding: 110px 15px 70px 15px; overflow-y: auto; }
        .panel.active { display: block !important; }
        
        #top-bar { position: fixed; top: 0; width: 100%; height: 60px; background: #000; display: flex; align-items: center; padding: 10px; z-index: 1000; border-bottom: 1px solid #333; }
        #nav-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 1px solid #333; }
        
        .sub-nav { position: fixed; top: 60px; width: 100%; display: flex; justify-content: center; gap: 20px; background: #000; padding: 10px; z-index: 999; }
        .tab-btn { background: none; border: none; color: var(--text-grey); font-weight: bold; cursor: pointer; padding: 5px; }
        .tab-btn.active { color: var(--neon-pink); border-bottom: 2px solid var(--neon-pink); }
        
        .nav-btn { background: none; border: none; color: var(--text-grey); font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: var(--neon-pink); }
        .acc-btn { background: #222; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="top-bar">
        <input type="text" id="search-input" placeholder="Search Global..." style="flex:1; padding:10px; background:#222; color:white; border:none; border-radius:5px;">
        <button onclick="console.log('Search')" style="background:var(--neon-pink); border:none; padding:10px; color:white; border-radius:5px;">GO</button>
    </div>

    <div id="home-panel" class="panel active">
        <div class="sub-nav"><button class="tab-btn active" onclick="showSub(this)">For You</button><button class="tab-btn" onclick="showSub(this)">Movies</button></div>
        <h1>Feed</h1>
    </div>

    <div id="live-panel" class="panel">
        <div class="sub-nav"><button class="tab-btn active" onclick="showSub(this)">Active</button><button class="tab-btn" onclick="showSub(this)">Previous</button></div>
        <h1>Live Matches</h1>
    </div>

    <div id="download-panel" class="panel"><h1>Downloads</h1></div>

    <div id="account-panel" class="panel">
        <div style="text-align:center;">
            <div onclick="alert('Viewers Tracking Active')" style="cursor:pointer; font-size:1.5rem;">👁️</div>
            <div id="acc-username">@CreatorMaster</div>
            <div id="fol-count">100M+ Followers</div>
            <button id="action-btn" class="acc-btn" onclick="handleAction()">POST</button>
        </div>
        </div>

    <div id="nav-bar">
        <button class="nav-btn active" onclick="switchPanel('home-panel', this)">Home</button>
        <button class="nav-btn" onclick="switchPanel('live-panel', this)">Live</button>
        <button class="nav-btn" onclick="switchPanel('download-panel', this)">Download</button>
        <button class="nav-btn" onclick="switchPanel('account-panel', this)">Account</button>
    </div>

    <script>
        // GLOBAL SUPABASE CONNECTION
        const SUPABASE_URL = "https://gkfivuvtpfetzatz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_T2Sxps8oB5ilNda3IU1SZQ_1LLxmVSE";
        window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // NAVIGATION LOGIC
        function switchPanel(id, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        // SOCIAL STATE MACHINE
        let followState = 'Follow';
        function handleAction() {
            if(followState === 'Follow') { followState = 'Following'; }
            else if(followState === 'Following') { followState = 'Friends'; }
            document.getElementById('action-btn').innerText = followState;
        }

        function showSub(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
