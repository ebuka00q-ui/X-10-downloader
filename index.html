<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X10</title><script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:#0b0813;color:#fff;font-family:sans-serif}
        .P,.S{display:none}.P.active,.S.active{display:block}
        .video-player{width:100%;height:auto;display:block;background:black}
        .movie-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px;padding:10px}
        .movie-card{background:#130f22;border:1px solid #ffffff10;padding:8px;border-radius:12px;text-align:center}
        .cube-img{aspect-ratio:1/1;width:100%;object-fit:cover;border-radius:8px}
    </style>
</head>
<body class="pb-20">
    <main class="max-w-md mx-auto w-full p-4">
        <div id="page-home" class="P active space-y-4">
            <div class="flex text-center text-xs font-bold border-b border-white/5 uppercase">
                <button id="btn-sub-foryou" class="flex-1 pb-2 border-b-2 border-indigo-500 text-white">For You</button>
                <button id="btn-sub-movies" class="flex-1 pb-2 border-b-2 border-transparent text-gray-400">Movies</button>
            </div>
            <div id="sub-foryou" class="S active">
                <div class="text-gray-500 text-center py-10">FYP Content Loading...</div>
            </div>
            <div id="sub-movies" class="S">
                <div class="movie-grid" id="movie-gallery"></div>
            </div>
        </div>
    </main>
    <nav class="fixed bottom-0 inset-x-0 bg-[#0d091a] p-4 flex justify-around border-t border-white/5">
        <button onclick="switchTab('home')" class="text-indigo-400 font-bold">Home</button>
        <button onclick="switchTab('live')" class="text-gray-400">Live</button>
        <button onclick="switchTab('downloads')" class="text-gray-400">Downloads</button>
    </nav>
    <script>
        const catalogMovies=[
            {title:'Avatar',year:'2026',poster:'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=200'},
            {title:'Ocean Rise',year:'2025',poster:'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=200'}
        ];

        function switchTab(t){
            document.querySelectorAll('.P').forEach(p=>p.classList.remove('active'));
            document.getElementById('page-'+t).classList.add('active');
        }

        document.getElementById('btn-sub-movies').onclick = () => {
            document.getElementById('sub-foryou').classList.remove('active');
            document.getElementById('sub-movies').classList.add('active');
            renderMovies();
        };

        document.getElementById('btn-sub-foryou').onclick = () => {
            document.getElementById('sub-movies').classList.remove('active');
            document.getElementById('sub-foryou').classList.add('active');
        };

        function renderMovies(){
            const g = document.getElementById('movie-gallery');
            g.innerHTML = catalogMovies.map(m => `
                <div class="movie-card">
                    <img src="${m.poster}" class="cube-img">
                    <p class="text-[10px] mt-2 font-bold">${m.title}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
